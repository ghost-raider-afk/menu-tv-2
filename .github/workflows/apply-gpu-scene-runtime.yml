name: Apply GPU scene runtime migration

on:
  push:
    branches:
      - feat/gpu-scene-layer-composer
    paths:
      - .github/workflows/apply-gpu-scene-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gpu-scene-layer-composer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement for {old[:80]!r}, got {text.count(old)}')
              write(path, text.replace(old, new, 1))

          player = 'src/web/admin-ui/public/js/player/player.js'
          replace_once(player,
              "import { LiveMenuMotion } from '../motion/live-menu-motion.js';\nimport { FlatMenuRenderer, playerMenuRenderMode } from './flat-menu-renderer.js';",
              "import { FlatMenuRenderer, playerMenuRenderMode } from './flat-menu-renderer.js';\nimport { GpuSceneRuntime } from './gpu-scene-runtime.js';\nimport { PlayerSceneLayerComposer } from './scene-layer-composer.js';")
          replace_once(player,
              "const liveMotion = new LiveMenuMotion(playerStage);\nconst flatMenuRenderer = new FlatMenuRenderer();",
              "const sceneLayers = new PlayerSceneLayerComposer(playerStage);\nconst flatMenuRenderer = new FlatMenuRenderer();\nconst gpuSceneRuntime = new GpuSceneRuntime(playerStage, { composer: sceneLayers });")
          replace_once(player,
              "  liveMotion.destroy();\n  setHidden(player, true);",
              "  gpuSceneRuntime.destroy();\n  flatMenuRenderer.destroy();\n  setHidden(player, true);")

          text = read(player)
          text, count = re.subn(r"\nfunction ensurePlayerLayer\(className, attribute\) \{.*?\n\}\n\nfunction renderPlayerContext", "\nfunction renderPlayerContext", text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'{player}: ensurePlayerLayer removal count={count}')
          start = text.index('function renderPlayerContext(context) {')
          end = text.index('\nfunction showConnectionMessage', start)
          replacement = '''function renderPlayerContext(context) {
            const viewport = resolutionOf(context.screen);
            const model = buildRenderModel(context.draft, viewport);
            const lines = buildDisplayLines(model, {
              products: context.products || [],
              packaging: context.packaging || [],
              fallbackTitle: context.screen?.name || 'Меню'
            });
            const layout = buildRenderLayout(model, lines);
            const { menu: menuLayer, entity: entityLayer, announcement: announcementLayer } = sceneLayers.ensureCore();
            const menuSvg = buildTableSvg(model, lines, layout);
            const renderMode = playerMenuRenderMode(context);
            menuLayer.dataset.renderMode = renderMode;

            void flatMenuRenderer.render(menuLayer, menuSvg, viewport).catch((error) => {
              console.error('Flat TV menu render failed; using static DOM fallback', error);
              if (menuLayer.dataset.renderMode !== renderMode) return;
              flatMenuRenderer.destroy();
              menuLayer.innerHTML = menuSvg;
              menuLayer.dataset.renderMode = 'dom-fallback';
              gpuSceneRuntime.destroy();
            });

            playerStage.style.backgroundColor = model.settings.background_color || '#101828';
            const background = sameOriginAsset(model.settings.background_image_url);
            playerStage.style.backgroundImage = background ? `url(${JSON.stringify(background)})` : 'none';
            renderSceneEntity(playerStage, context.entity, { editable: false });
            renderAnnouncementLayer(announcementLayer, context.announcement);
            gpuSceneRuntime.render({
              enabled: renderMode === 'flat-gpu',
              profile: context.animation?.profile,
              viewport,
              settings: model.settings
            });
            entityLayer.setAttribute('aria-hidden', 'true');
            playerRefreshMs = Math.max(2000, Number(context.refresh_interval_ms) || 5000);
          }
          '''
          text = text[:start] + replacement + text[end:]
          if 'LiveMenuMotion' in text or 'liveMotion.' in text:
              raise SystemExit(f'{player}: legacy LiveMenuMotion reference remains')
          write(player, text)

          css = 'src/web/admin-ui/public/css/player.css'
          text = read(css)
          start = text.index('.tv-player-menu-layer,.tv-player-aquarium-layer')
          end = text.index('.tv-player-entity-layer .animation-scene-entity', start)
          stack = '''.tv-player-menu-layer,.tv-player-aquarium-layer,.tv-player-fx-layer,.tv-player-content-layer,.tv-player-entity-layer,.tv-player-brand-layer,.tv-player-announcement-layer { position: absolute; inset: 0; }
          .tv-player-aquarium-layer { z-index: 0; overflow: hidden; pointer-events: none; }
          .tv-player-menu-layer { z-index: 1; overflow: hidden; }
          .tv-player-menu-layer > svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; overflow: hidden; }
          .tv-player-menu-flat { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
          .tv-player-fx-layer { z-index: 2; overflow: hidden; pointer-events: none; contain: layout paint style; }
          .tv-player-content-layer { z-index: 3; overflow: hidden; pointer-events: none; }
          .tv-player-gpu-menu-fx { position: absolute; overflow: hidden; pointer-events: none; contain: paint; }
          .tv-player-gpu-effect { position: absolute; inset: -42%; opacity: 0; pointer-events: none; will-change: transform, opacity; transform: translate3d(0,0,0); }
          .tv-player-gpu-effect.is-sweep { background: linear-gradient(100deg,transparent 32%,rgba(255,255,255,.18) 47%,rgba(246,201,14,.16) 50%,rgba(255,255,255,.12) 53%,transparent 68%); }
          .tv-player-gpu-effect.is-spark { background: linear-gradient(100deg,transparent 38%,rgba(255,255,255,.28) 48%,rgba(246,201,14,.22) 50%,rgba(255,255,255,.2) 52%,transparent 62%); }
          .tv-player-gpu-effect.is-pulse,.tv-player-gpu-effect.is-focus { background: radial-gradient(ellipse at center,rgba(255,255,255,.16),rgba(246,201,14,.10) 34%,transparent 68%); }
          .tv-player-stage [data-motion] { opacity: 1; transform-box: fill-box; transform-origin: center; }
          .tv-player-entity-layer { z-index: 4; overflow: hidden; pointer-events: none; }
          '''
          text = text[:start] + stack + text[end:]
          text = text.replace('.tv-player-brand-layer { z-index: 3;', '.tv-player-brand-layer { z-index: 5;', 1)
          text = text.replace('.tv-player-announcement-layer { z-index: 4;', '.tv-player-announcement-layer { z-index: 6;', 1)
          write(css, text)

          sw = 'src/web/admin-ui/public/player-sw.js'
          text = read(sw)
          text = text.replace("const SHELL_CACHE = 'mira-tv-player-shell-v10';", "const SHELL_CACHE = 'mira-tv-player-shell-v11';", 1)
          text = text.replace("const DATA_CACHE = 'mira-tv-player-data-v10';", "const DATA_CACHE = 'mira-tv-player-data-v11';", 1)
          text = text.replace("  '/js/player/flat-menu-renderer.js',\n", "  '/js/player/flat-menu-renderer.js',\n  '/js/player/scene-layer-composer.js',\n  '/js/player/gpu-scene-runtime.js',\n", 1)
          for asset in [
              "  '/js/motion/live-menu-motion.js',\n",
              "  '/js/motion/motion-plan.js',\n",
              "  '/js/motion/drivers/wasm-motion-driver.js',\n",
              "  '/js/motion/wasm-motion-kernel.js',\n",
              "  '/wasm/mira-motion-kernel.wasm'\n"
          ]:
              if asset not in text:
                  raise SystemExit(f'{sw}: expected retired asset missing: {asset.strip()}')
              text = text.replace(asset, '', 1)
          text = text.replace("  '/js/motion/drivers/waapi-driver.js',\n];", "  '/js/motion/drivers/waapi-driver.js'\n];", 1)
          write(sw, text)

          browser = 'tests/browser/player-refresh-resilience.spec.js'
          text = read(browser)
          marker = "animated TV menu stays flat and uses one compositor scene effect across 304 refresh"
          if marker not in text:
              text += r'''

          test('animated TV menu stays flat and uses one compositor scene effect across 304 refresh', async ({ browser }) => {
            const context = await browser.newContext({ baseURL, serviceWorkers: 'block' });
            const page = await context.newPage();
            let playerContextRequests = 0;
            try {
              await page.route('**/api/device/session', (route) => route.fulfill({
                status: 200, contentType: 'application/json',
                body: JSON.stringify({
                  authorized: true, device_id: 1, device_key: 'device-key-gpu-scene-123456',
                  session_expires_at: new Date(Date.now() + 86400000).toISOString(),
                  screen: { id: 1, name: 'ТВ 1', resolution: '1920x1080', location_id: 1, location_name: 'Точка 1', location_number: 1 }
                })
              }));
              await page.route('**/api/device/player-context', (route) => {
                playerContextRequests += 1;
                if (route.request().headers()['if-none-match'] === '"gpu-v1"') {
                  return route.fulfill({ status: 304, headers: { ETag: '"gpu-v1"' } });
                }
                return route.fulfill({
                  status: 200,
                  headers: { ETag: '"gpu-v1"' },
                  contentType: 'application/json',
                  body: JSON.stringify({
                    screen: { id: 1, name: 'ТВ 1', resolution: '1920x1080', location_id: 1, location_name: 'Точка 1', location_number: 1 },
                    draft: { rows: [], settings: { table_x: 56, table_y: 15, table_width_px: 1374, table_height_px: 925 }, revision: 1 },
                    products: [], packaging: [],
                    animation: { enabled: true, profile: { pattern: 'cinematic', intensity: 65, cycle_seconds: 8, flow_direction: 'left-to-right' } },
                    entity: null, announcement: null, brand: null, aquarium: null,
                    refresh_interval_ms: 2000
                  })
                });
              });

              await page.goto('/player.html');
              const menu = page.locator('[data-player-menu-layer]');
              await expect(menu).toHaveAttribute('data-render-mode', 'flat-gpu');
              await expect(menu.locator('[data-flat-menu-canvas]')).toHaveCount(1);
              await expect(menu.locator('svg')).toHaveCount(0);
              const effect = page.locator('[data-player-fx-layer] [data-gpu-scene-effect]');
              await expect(effect).toHaveCount(1);
              await effect.evaluate((node) => { node.dataset.gpuIdentity = 'preserved'; });
              await expect.poll(() => playerContextRequests, { timeout: 5000 }).toBeGreaterThanOrEqual(2);
              await expect(effect).toHaveAttribute('data-gpu-identity', 'preserved');
              await expect(menu.locator('[data-flat-menu-canvas]')).toHaveCount(1);
            } finally {
              await context.close();
            }
          });
          '''
          write(browser, text)

          arch = 'docs/ARCHITECTURE.md'
          text = read(arch)
          old = '''До завершения переноса существующего row motion на GPU layers TV Player допускает capability fallback:

          - animation profile выключен → Flat renderer;
          - legacy row motion ещё требуется → DOM motion compatibility renderer;
          - после GPU migration обычное меню всегда должно идти через Flat renderer.
          '''
          new = '''TV Player больше не использует row-by-row DOM/WASM motion. Обычное меню всегда идёт через Flat renderer:

          - animation profile выключен → одна `Flat Menu Surface`;
          - animation profile включён → `Flat Menu Surface` + один coarse compositor FX layer;
          - DOM/WASM row motion остаётся только Studio/legacy capability и не входит в TV offline shell.

          `GpuSceneRuntime` компилирует профиль в compositor-friendly WAAPI keyframes. Для постоянного menu motion разрешены только `transform` и `opacity`: runtime не держит собственный `requestAnimationFrame`, не пишет `filter` покадрово и не увеличивает число animated targets вместе с количеством строк меню.
          '''
          if old not in text:
              raise SystemExit(f'{arch}: old Flat renderer transition block not found')
          write(arch, text.replace(old, new, 1))

          motion = 'docs/MOTION-ENGINE-V3.md'
          text = read(motion)
          heading = '## TV compositor runtime'
          if heading not in text:
              text += '''

          ## TV compositor runtime

          Motion Studio и TV Player разделяют semantic scene contracts, но не обязаны использовать один concrete renderer path. TV Player оптимизирован для длительного воспроизведения на Smart TV:

          ```text
          Canonical Menu Model
                  ↓
             Flat Menu Surface
                  +
          PlayerSceneLayerComposer
                  ↓
             GpuSceneRuntime
                  ↓
          Browser compositor / WAAPI
          ```

          Инварианты TV runtime:
          - количество постоянных menu-motion targets — `O(1)`, а не `O(number of rows)`;
          - нет row-by-row `requestAnimationFrame` цикла;
          - нет покадровых `filter`, `blur` и `drop-shadow` для базового menu motion;
          - профиль компилируется в одну coarse `transform/opacity` animation;
          - `Entity / Object+` сохраняет отдельного runtime-владельца;
          - будущие `Promo`, `Content` и `Story` добавляются как независимые крупные слои через `PlayerSceneLayerComposer`.

          `WasmMotionDriver` остаётся допустимым Studio/legacy driver, но больше не является зависимостью TV offline shell.
          '''
          write(motion, text)

          roadmap = 'docs/ROADMAP.md'
          text = read(roadmap)
          heading = '## GPU Scene Layer Composer — реализован'
          if heading not in text:
              text += '''

          ## GPU Scene Layer Composer — реализован

          - TV Player использует Flat Menu Surface даже при включённом animation profile;
          - введён стабильный semantic layer stack: `menu / fx / content / entity / brand / announcement`;
          - базовый menu motion компилируется в один coarse compositor effect;
          - row-by-row WASM runtime удалён из TV Player и его offline shell;
          - Motion Studio сохраняет legacy motion capability до отдельной миграции preview;
          - следующий этап: `Scene Playlist` contract + `PromoScene / ContentScene`, затем Actor lifecycle для Object+.
          '''
          write(roadmap, text)
          PY
      - name: Validate focused contracts
        run: |
          npm ci
          node --check src/web/admin-ui/public/js/player/player.js
          node --check src/web/admin-ui/public/js/player/gpu-scene-runtime.js
          node --check src/web/admin-ui/public/js/player/scene-layer-composer.js
          node --check src/web/admin-ui/public/player-sw.js
          node --test tests/player-render-mode.test.js tests/gpu-scene-runtime.test.js tests/tv-scene-runtime-ownership.test.js tests/entity-behavior.test.js
          git diff --check
      - name: Commit migration
        shell: bash
        run: |
          git rm .github/workflows/apply-gpu-scene-runtime.yml
          git add docs src tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move TV menu motion to GPU scene layers"
          git push origin HEAD:feat/gpu-scene-layer-composer
