name: finalize-v17-text

on:
  push:
    branches: [work/v1.7.0-mira]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: work/v1.7.0-mira
          fetch-depth: 0
      - name: Finalize public branding and release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          if '## [1.7.0]' not in text:
              lines = [
                  '## [1.7.0] - 2026-08-25',
                  '',
                  '### MIRA-TV',
                  '- Публичное имя продукта изменено на MIRA-TV / MIRA TV; legacy package, БД, cookie, compose identifiers и путь обновления установщика сохранены для совместимости.',
                  '',
                  '### Motion Engine',
                  '- Добавлен C++ motion kernel с воспроизводимой сборкой в WebAssembly и непрерывной периодической sin/cos-математикой вместо дискретных keyframes меню.',
                  '- Строка меню теперь имеет одного transform owner: название, характеристики и цены движутся как единая SVG-группа; фон остаётся полностью статичным.',
                  '- Эффект «Акция» заменён на cinematic scale плашки, красную световую волну через всю строку, мягкое послесвечение и бесшовный цикл без bounce/elastic рывков.',
                  '',
                  '### Video Entity v2',
                  '- Entity поддерживает PNG, WebP, MP4 и WebM с media_type/asset_type, loop, muted, playsinline, playback_rate, размерами, transform и opacity.',
                  '- MP4/WebM анализируются через ffprobe; alpha определяется по медиаданным, тяжёлый покадровый chroma key на ТВ не используется.',
                  '- Видео участвует в offline cache Player с поддержкой Range / 206 Partial Content.',
                  '',
                  '### QR scanner',
                  '- Исправлены secure-context/iOS camera diagnostics, ожидание реального видеокадра, fallback camera constraints и проверка window.jsQR.',
                  '- Scanner получил единый rAF lifecycle и корректный dispose при SPA-навигации, поэтому камера и listeners не переживают уход со страницы.',
                  '',
                  '### Build / release',
                  '- Production Docker image собирает WASM из C++ source и содержит ffmpeg/ffprobe.',
                  '- CI сведён к одному PR gate с тремя job: node-check, browser-visual и clean-install-smoke; автоматический release/branch cleanup удалён.',
                  '',
              ]
              changelog.write_text('\n'.join(lines) + '\n' + text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('# ТВ МЕНЮ 2.0', '# MIRA-TV', 1)
          text = text.replace('Актуальный стабильный релиз: **`1.3.3`**. Версия установщика: **`1.3.2`**.', 'Версия приложения в этой ветке: **`1.7.0`**. Независимая версия установщика: **`1.3.3`**.', 1)
          text = text.replace('/installer-v1.3.2/menu-tv-2.sh', '/installer-v1.3.3/menu-tv-2.sh')
          readme.write_text(text)

          public_root = Path('src/web/admin-ui/public')
          for path in public_root.rglob('*'):
              if path.suffix not in {'.html', '.js'} or not path.is_file():
                  continue
              source = path.read_text()
              updated = source.replace('ТВ МЕНЮ 2', 'MIRA-TV').replace('ТВ МЕНЮ', 'MIRA-TV')
              if updated != source:
                  path.write_text(updated)

          player = Path('src/web/admin-ui/public/js/player/player.js').read_text()
          if 'Запускаем MIRA-TV' not in player:
              raise SystemExit('player branding was not finalized')
          PY
          ! grep -R -n -F 'ТВ МЕНЮ' src/web/admin-ui/public --include='*.html' --include='*.js'
          grep -F '## [1.7.0] - 2026-08-25' CHANGELOG.md
          grep -F '# MIRA-TV' README.md
          git diff --check
      - name: Commit finalized text
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md README.md src/web/admin-ui/public
          git commit -m 'Finalize MIRA-TV v1.7.0 branding and changelog'
          git push origin HEAD:work/v1.7.0-mira
