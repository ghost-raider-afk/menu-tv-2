name: sync-1-3-1

on:
  push:
    branches:
      - agent/adversarial-hardening-1.4
    paths:
      - .github/workflows/sync-1-3-1.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/adversarial-hardening-1.4
          fetch-depth: 0
      - name: Restore verified dependency lock and synchronize release metadata
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:package-lock.json > package-lock.json
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['package.json', 'package-lock.json']) {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            value.version = '1.3.1';
            if (value.packages?.['']) value.packages[''].version = '1.3.1';
            fs.writeFileSync(file, `${JSON.stringify(value, null, 2)}\n`);
          }
          NODE
          python3 <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          text = text.replace('## [1.4.0] - 2026-08-23', '## [1.3.1] - 2026-08-23', 1)
          changelog.write_text(text)

          installer = Path('menu-tv-2.sh')
          text = installer.read_text()
          text = text.replace('SCRIPT_VERSION="1.4.0"', 'SCRIPT_VERSION="1.3.1"', 1)
          anchor = '  delete_env_value "$env_file" TEMPLATE_BACKGROUND_MAX_BYTES\n'
          additions = (
              '  delete_env_value "$env_file" FRONTEND_ERROR_RETENTION_DAYS\n'
              '  delete_env_value "$env_file" FRONTEND_ERROR_MAX_ENTRIES\n'
          )
          if 'delete_env_value "$env_file" FRONTEND_ERROR_RETENTION_DAYS' not in text:
              text = text.replace(anchor, anchor + additions, 1)
          installer.write_text(text)

          workflow = Path('.github/workflows/check.yml')
          text = workflow.read_text()
          text = text.replace("FRONTEND_ERROR_RETENTION_DAYS: '14'", "EVENT_JOURNAL_RETENTION_DAYS: '30'")
          text = text.replace("FRONTEND_ERROR_MAX_ENTRIES: '2000'", "EVENT_JOURNAL_MAX_ENTRIES: '5000'")
          text = text.replace("grep -Fx 'FRONTEND_ERROR_RETENTION_DAYS=14' .env.example", "grep -Fx 'EVENT_JOURNAL_RETENTION_DAYS=30' .env.example")
          text = text.replace("grep -Fx 'FRONTEND_ERROR_MAX_ENTRIES=2000' .env.example", "grep -Fx 'EVENT_JOURNAL_MAX_ENTRIES=5000' .env.example")
          canonical = "          ! grep -q 'TEMPLATE_BACKGROUND_MAX_BYTES' .env.example\n"
          if "! grep -q 'FRONTEND_ERROR_RETENTION_DAYS' .env.example" not in text:
              text = text.replace(canonical, canonical + "          ! grep -q 'FRONTEND_ERROR_RETENTION_DAYS' .env.example\n          ! grep -q 'FRONTEND_ERROR_MAX_ENTRIES' .env.example\n")
          text = text.replace("!css.includes('./pages/error-log.css')", "!css.includes('./pages/events.css')")
          text = text.replace("const journalResponse = await fetch(`${base}/api/diagnostics/frontend-errors?limit=5`, { headers: { Cookie: cookie } });\n          if (!journalResponse.ok || !(await journalResponse.json()).items.some((item) => item.message === 'CI frontend journal probe')) throw new Error('frontend journal read failed');", "const journalResponse = await fetch(`${base}/api/notifications/events?limit=5&severity=error&category=interface`, { headers: { Cookie: cookie } });\n          const journalBody = await journalResponse.json();\n          if (!journalResponse.ok || !journalBody.items.some((item) => item.message === 'CI frontend journal probe' && item.severity === 'error' && item.category === 'interface')) throw new Error('event journal read failed');")
          workflow.write_text(text)
          PY
      - name: Commit synchronized release metadata
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json CHANGELOG.md menu-tv-2.sh .github/workflows/check.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Prepare TV Menu 2 v1.3.1 release gate'
          git push origin HEAD:agent/adversarial-hardening-1.4
