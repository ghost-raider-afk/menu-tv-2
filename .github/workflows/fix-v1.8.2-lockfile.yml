name: Normalize v1.8.2 release diff

on:
  push:
    branches:
      - fix/v1.8.2-brand-entity-decoupling
    paths:
      - .github/workflows/fix-v1.8.2-lockfile.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/v1.8.2-brand-entity-decoupling
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Restore canonical lockfile formatting and harden browser assertion
        shell: bash
        run: |
          set -euo pipefail
          checkpoint='3ab28094f8c415ad9554ddeb4c086f5fe055bd4a'
          git show "${checkpoint}:package-lock.json" > package-lock.json

          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const checkpoint = '3ab28094f8c415ad9554ddeb4c086f5fe055bd4a';
          let lockText = fs.readFileSync('package-lock.json', 'utf8');
          let replacements = 0;
          lockText = lockText.replace(/"version": "1\.8\.1"/g, (match) => {
            replacements += 1;
            return replacements <= 2 ? '"version": "1.8.2"' : match;
          });
          assert.ok(replacements >= 2, 'expected root and package-root versions in checkpoint lockfile');
          fs.writeFileSync('package-lock.json', lockText);

          const currentLock = JSON.parse(lockText);
          const expectedLock = JSON.parse(execFileSync('git', ['show', `${checkpoint}:package-lock.json`], { encoding: 'utf8' }));
          expectedLock.version = '1.8.2';
          expectedLock.packages[''].version = '1.8.2';
          assert.deepEqual(currentLock, expectedLock, 'lockfile must differ from checkpoint only by application version');

          const browserPath = 'tests/browser/animation-studio.spec.js';
          let browser = fs.readFileSync(browserPath, 'utf8');
          const before = `    await expect(inspector.locator('.animation-inspector-tabs')).toContainText(['Меню', 'Текст', 'Сцена']);`;
          const after = `    await expect(inspector.locator('.animation-inspector-tabs')).toContainText('Меню');\n    await expect(inspector.locator('.animation-inspector-tabs')).toContainText('Текст');\n    await expect(inspector.locator('.animation-inspector-tabs')).toContainText('Сцена');`;
          assert.ok(browser.includes(before), 'Motion Studio tab assertion anchor not found');
          browser = browser.replace(before, after);
          fs.writeFileSync(browserPath, browser);
          NODE

          rm .github/workflows/fix-v1.8.2-lockfile.yml

          npm ci
          npm run check
          git diff --check

          lock_stat="$(git diff --numstat "$checkpoint" -- package-lock.json)"
          test "$lock_stat" = $'2\t2\tpackage-lock.json'
      - name: Commit normalized release diff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Normalize v1.8.2 release diff'
          git push origin HEAD:fix/v1.8.2-brand-entity-decoupling
