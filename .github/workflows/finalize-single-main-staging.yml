name: finalize-single-main-staging

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidate-single-main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Repair and validate generated workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('check.generated.yml')
          text = path.read_text()
          stable_block = '''      - name: Check stable release installer
        run: |
          bash menu-tv-2.sh help | grep -F 'Канал обновлений: стабильные GitHub Releases'
          bash menu-tv-2.sh help | grep -F 'Версия скрипта: 1.3.0'
          ! grep -q 'MENU_TV_REF' menu-tv-2.sh
          ! grep -q '^BRANCH=' menu-tv-2.sh
'''
          text, count = re.subn(
              r"      - name: Check stable release installer\n        run: \|\n.*?(?=      - name: Check canonical environment\n)",
              stable_block,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'installer check block rewrite failed: {count}')
          marker = '\n  release-and-cleanup:\n'
          if marker not in text:
              raise SystemExit('release job marker missing')
          prefix = text.split(marker, 1)[0].rstrip()
          release_job = r'''

  release-and-cleanup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - node-check
      - browser-visual
      - clean-install-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout verified main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve canonical version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          ROOT_LOCK_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$LOCK_VERSION" == "$VERSION" ]]
          [[ "$ROOT_LOCK_VERSION" == "$VERSION" ]]
          grep -F "## [$VERSION]" CHANGELOG.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists; no new release is created."
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "TV Menu 2 $TAG" --generate-notes
          fi
      - name: Remove every branch except main
        shell: bash
        run: |
          git ls-remote --heads origin | while read -r _ ref; do
            branch="${ref#refs/heads/}"
            [[ "$branch" == main ]] && continue
            echo "Deleting obsolete branch: $branch"
            git push origin --delete "$branch"
          done
'''
          path.write_text(prefix + release_job.rstrip() + '\n')
          PY
          ruby -e "require 'yaml'; YAML.load_file('check.generated.yml')"
          cp .github/workflows/check.yml /tmp/check.yml.original
          cp check.generated.yml .github/workflows/check.yml
          npm ci
          npm run check
          cp /tmp/check.yml.original .github/workflows/check.yml
          git diff --check
      - name: Commit corrected staging workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add check.generated.yml
          if git diff --cached --quiet; then
            echo 'Staging workflow already valid.'
            exit 0
          fi
          git commit -m 'Validate release workflow structure'
          git push origin HEAD:agent/consolidate-single-main
