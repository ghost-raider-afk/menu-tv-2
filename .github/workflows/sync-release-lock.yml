name: sync-release-lock

on:
  push:
    branches:
      - release/v1.4.0

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: release/v1.4.0
      - name: Synchronize application version in package-lock
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = pkg.version;
          lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
      - name: Commit synchronized lock
        run: |
          test "$(node -p "require('./package.json').version")" = "1.4.0"
          test "$(node -p "require('./package-lock.json').version")" = "1.4.0"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "1.4.0"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Release v1.4.0: synchronize package lock"
          git push origin HEAD:release/v1.4.0
