name: release

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify release candidate
        id: release
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          test -n "$VERSION"
          grep -F "## [${VERSION}]" CHANGELOG.md >/dev/null

          git fetch origin main --depth=1
          MAIN_SHA="$(git rev-parse origin/main)"
          CURRENT_SHA="$(git rev-parse HEAD)"
          test "$CURRENT_SHA" = "$VERIFIED_SHA"
          test "$MAIN_SHA" = "$VERIFIED_SHA"

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          awk -v header="## [${VERSION}]" '
            index($0, header) == 1 { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish stable GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_SHA" \
            --title "MIRA-TV $TAG" \
            --notes-file /tmp/release-notes.md
