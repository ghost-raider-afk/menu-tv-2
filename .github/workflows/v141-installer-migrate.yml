name: v1.4.1 installer migration
on:
  push:
    branches: [release/v1.4.1]
permissions:
  contents: write
jobs:
  migrate-installer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update installer security default migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('menu-tv-2.sh')
          s = p.read_text()
          s = s.replace('SCRIPT_VERSION="1.3.2"', 'SCRIPT_VERSION="1.3.3"', 1)
          needle = '  cleanup_obsolete_env "$env_file"\n\n  [[ -n "$(env_value SFTP_PUBLIC_HOST "$env_file")" ]]'
          replacement = '''  cleanup_obsolete_env "$env_file"\n\n  # v1.3.3: migrate only the previous canonical QR lifetime; preserve deliberate custom values.\n  if [[ "$(env_value DEVICE_ACTIVATION_TTL_MINUTES "$env_file")" == "10" ]]; then\n    set_env_value "$env_file" DEVICE_ACTIVATION_TTL_MINUTES "2"\n    info "Срок действия QR подключения сокращён с 10 до 2 минут."\n  fi\n\n  [[ -n "$(env_value SFTP_PUBLIC_HOST "$env_file")" ]]'''
          if needle not in s:
              raise SystemExit('installer insertion point not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY
          bash -n menu-tv-2.sh
      - name: Commit installer migration
        run: |
          if git diff --quiet -- menu-tv-2.sh; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add menu-tv-2.sh
          git commit -m "Installer 1.3.3: migrate default QR lifetime"
          git push
