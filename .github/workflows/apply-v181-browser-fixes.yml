name: Apply v1.8.1 Chromium fixes

on:
  push:
    branches:
      - fix/v1.8.1-player-pairing-mobile-qr
    paths:
      - .github/workflows/apply-v181-browser-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.8.1-player-pairing-mobile-qr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply fixes
        run: |
          node scripts/apply-v181-browser-fixes.mjs
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const path = 'tests/device-player-architecture.test.js';
          let source = await readFile(path, 'utf8');
          source = source.replace(
            "  assert.match(source, /value = value && typeof value === 'object' ? value : {}/);",
            "  assert.ok(source.includes(\"value = value && typeof value === 'object' ? value : {};\"));"
          );
          await writeFile(path, source);
          NODE
      - name: Validate
        run: |
          npm ci
          npm run check
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web/admin-ui/public/js/player/player.js src/web/admin-ui/public/js/motion/entity-editor.js tests/browser/connect-tv-mobile.spec.js tests/device-player-architecture.test.js
          git commit -m 'Close v1.8.1 Chromium regressions'
          git push origin HEAD:fix/v1.8.1-player-pairing-mobile-qr
