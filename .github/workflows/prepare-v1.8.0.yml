name: Finalize MIRA-TV v1.8.0 metadata

on:
  push:
    branches: ["work/v1.8.0-motion-brand-aquarium"]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: work/v1.8.0-motion-brand-aquarium
          fetch-depth: 0
      - name: Restore minimal lockfile diff and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git show 8f8e0f77c7b38b7e966b7875c263a5ef5d01a112:package-lock.json > package-lock.json
          python3 -c "from pathlib import Path; p=Path('package-lock.json'); s=p.read_text(); s=s.replace('\"version\": \"1.7.0\"','\"version\": \"1.8.0\"',2); p.write_text(s)"
          grep -q '^  "version": "1.8.0",$' package-lock.json
          grep -q '^      "version": "1.8.0",$' package-lock.json
          grep -q '^  "version": "1.8.0",$' package.json
          grep -q '^## \[1\.8\.0\] - 2026-08-26$' CHANGELOG.md
          git rm .github/workflows/prepare-v1.8.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Finalize MIRA-TV v1.8.0 release metadata'
          git push origin HEAD:work/v1.8.0-motion-brand-aquarium
