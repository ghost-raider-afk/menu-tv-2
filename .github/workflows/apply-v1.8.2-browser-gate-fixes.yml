name: apply-v1.8.2-browser-gate-fixes

on:
  push:
    branches:
      - fix/v1.8.2-brand-entity-decoupling

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/v1.8.2-brand-entity-decoupling
          fetch-depth: 0
      - name: Apply focused release-gate fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'tests/browser/animation-studio.spec.js',
              "await expect(inspector.locator('.animation-inspector-actions #animation-apply')).toBeVisible();",
              "await expect(inspector.locator('.animation-inspector-actions #animation-apply-screens')).toBeVisible();"
          )

          replace_once(
              'tests/browser/brand-title-editing.spec.js',
              "    await page.goto('/animation.html');\n    const input = page.locator('#animation-brand-text');",
              "    await page.goto('/animation.html');\n    const textTab = page.locator('[data-animation-inspector-tab=\"text\"]');\n    await textTab.click();\n    await expect(textTab).toHaveClass(/active/);\n    const input = page.locator('#animation-brand-text');"
          )

          mobile = Path('tests/browser/mobile-shell.spec.js')
          text = mobile.read_text()
          if text.count("toHaveCount(4)") != 2:
              raise SystemExit('mobile-shell: expected two legacy rail-count assertions')
          text = text.replace("toHaveCount(4)", "toHaveCount(5)")
          old = """    await expect(rail.getByLabel('Каталог')).toBeVisible();\n    await expect(rail.getByLabel('Настройки')).toBeVisible();"""
          new = """    await expect(rail.getByLabel('Каталог')).toBeVisible();\n    await expect(rail.getByLabel('Анимация')).toBeVisible();\n    await expect(rail.getByLabel('Настройки')).toBeVisible();"""
          if text.count(old) != 1:
              raise SystemExit('mobile-shell: primary navigation assertion block not found')
          text = text.replace(old, new, 1)
          old = """    await page.getByRole('link', { name: /^Анимация/ }).click();\n    await expect(page).toHaveURL(/\\/animation\\.html$/);\n    await expect(page.locator('.ui-context')).toHaveClass(/is-collapsed/);\n    await expect(page.locator('body')).not.toHaveClass(/ui-context-open/);\n    await expectNoPageOverflow(page);"""
          new = """    await page.getByRole('link', { name: /^Журнал событий/ }).click();\n    await expect(page).toHaveURL(/\\/events\\.html$/);\n    await expect(page.locator('.ui-context')).toHaveClass(/is-collapsed/);\n    await expect(page.locator('body')).not.toHaveClass(/ui-context-open/);\n\n    await page.locator('.ui-rail').getByLabel('Анимация').click();\n    await expect(page).toHaveURL(/\\/animation\\.html$/);\n    await expect(page.locator('.ui-context')).toHaveClass(/is-collapsed/);\n    await expectNoPageOverflow(page);"""
          if text.count(old) != 1:
              raise SystemExit('mobile-shell: legacy Animation context navigation block not found')
          mobile.write_text(text.replace(old, new, 1))

          html = Path('src/web/admin-ui/public/settings.html')
          text = html.read_text()
          replacements = {
              'maxlength="80" required />': 'maxlength="80" required disabled />',
              'type="color" value="#F4C915" required />': 'type="color" value="#F4C915" required disabled />',
              '<select id="site-signin-logo-size" name="signin_logo_size">': '<select id="site-signin-logo-size" name="signin_logo_size" disabled>',
              'list="timezone-options" maxlength="80" required />': 'list="timezone-options" maxlength="80" required disabled />',
              '<select id="site-date-format" name="date_format">': '<select id="site-date-format" name="date_format" disabled>',
              'name="dashboard_refresh_seconds" type="number" step="1" required />': 'name="dashboard_refresh_seconds" type="number" step="1" required disabled />',
              'name="default_screen_resolution" type="text" maxlength="32" required />': 'name="default_screen_resolution" type="text" maxlength="32" required disabled />',
              'id="site-settings-submit" type="submit">': 'id="site-settings-submit" type="submit" disabled>'
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'settings.html: expected one match for {old!r}, got {text.count(old)}')
              text = text.replace(old, new, 1)
          html.write_text(text)

          settings = Path('src/web/admin-ui/public/js/pages/settings.js')
          text = settings.read_text()
          old = """  });\n}\n"""
          new = """  });\n  siteForm.querySelectorAll('input, select, button').forEach((control) => {\n    if (control.id !== 'site-domain') control.disabled = false;\n  });\n  siteForm.dataset.hydrated = 'true';\n}\n"""
          if not text.endswith(old):
              raise SystemExit('settings.js: expected initialiseSettings tail not found')
          settings.write_text(text[:-len(old)] + new)
          PY
          node --check src/web/admin-ui/public/js/pages/settings.js
          git diff --check
      - name: Commit focused fixes and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v1.8.2-browser-gate-fixes.yml
          git add tests/browser/animation-studio.spec.js tests/browser/brand-title-editing.spec.js tests/browser/mobile-shell.spec.js src/web/admin-ui/public/settings.html src/web/admin-ui/public/js/pages/settings.js
          git commit -m "Fix final v1.8.2 browser release gate"
          git push origin HEAD:fix/v1.8.2-brand-entity-decoupling
