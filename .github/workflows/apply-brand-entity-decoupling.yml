name: Apply Brand Entity decoupling

on:
  push:
    branches:
      - fix/v1.8.2-brand-entity-decoupling
    paths:
      - .github/workflows/apply-brand-entity-decoupling.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.8.2-brand-entity-decoupling
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply patch
        run: node scripts/apply-brand-entity-decoupling.mjs
      - name: Validate
        run: |
          npm ci
          npm run check
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web/admin-ui/public/animation.html src/web/admin-ui/public/js/pages/animation.js tests/animation-studio.test.js
          git commit -m 'Make Brand Entity fully editable'
          git push origin HEAD:fix/v1.8.2-brand-entity-decoupling
