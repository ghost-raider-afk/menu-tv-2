name: apply-installer-fast-path

on:
  push:
    branches: [fix/installer-update-fast-path]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/installer-update-fast-path
          fetch-depth: 0

      - name: Normalize output strings
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('menu-tv-2.sh')
          text = path.read_text()
          text = text.replace(
              "printf 'MIRA-TV v%s уже актуален.\n' \"$current_version\"",
              r'''printf 'MIRA-TV v%s уже актуален.\n' "$current_version"''',
              1,
          )
          text = text.replace(
              "printf 'Доступно обновление MIRA-TV: v%s → v%s\n' \"$current_version\" \"$latest_version\"",
              r'''printf 'Доступно обновление MIRA-TV: v%s → v%s\n' "$current_version" "$latest_version"''',
              1,
          )
          path.write_text(text)
          PY
          bash -n menu-tv-2.sh
          node --test tests/installer-update-flow.test.js

      - name: Commit normalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu-tv-2.sh
          git commit -m 'Normalize installer update output strings'
          git push origin HEAD:fix/installer-update-fast-path
