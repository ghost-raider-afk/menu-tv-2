name: apply-installer-fast-path

on:
  push:
    branches: [fix/installer-update-fast-path]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/installer-update-fast-path
          fetch-depth: 0

      - name: Apply focused installer changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          installer = Path('menu-tv-2.sh')
          text = installer.read_text()
          text = text.replace('SCRIPT_VERSION="1.3.3"', 'SCRIPT_VERSION="1.3.4"', 1)
          text = text.replace(
              'git_as_project_owner -C "$INSTALL_DIR" fetch --depth 1 origin "refs/tags/$release_tag"',
              'git_as_project_owner -C "$INSTALL_DIR" fetch --quiet --depth 1 origin "refs/tags/$release_tag"',
              1,
          )

          new_update = r'''update_app() {
            local env_before current_version latest_tag latest_version remote_revision changed_files input
            local source_changed=false env_changed=false needs_runtime=false needs_build=false needs_database_backup=false needs_proxy=false
            require_root
            [[ -d "$INSTALL_DIR/.git" ]] || die "Menu TV 2.0 не установлен: $INSTALL_DIR"
            [[ -f "$INSTALL_DIR/.env" ]] || die "Отсутствует $INSTALL_DIR/.env"
            current_version="$(installed_project_version)" || die "Не удалось определить установленную версию из package.json."
            latest_tag="$(latest_release_tag)" || die "Не удалось определить последний стабильный GitHub Release."
            latest_version="$(release_tag_version "$latest_tag")"

            if [[ "$current_version" == "$latest_version" ]]; then
              printf 'MIRA-TV v%s уже актуален.\n' "$current_version"
              return
            fi
            if version_is_newer "$latest_version" "$current_version"; then
              warn "Установленная версия $current_version новее последнего опубликованного релиза $latest_version. Автоматическое понижение версии запрещено."
              return
            fi

            printf 'Доступно обновление MIRA-TV: v%s → v%s\n' "$current_version" "$latest_version"
            read -r -p 'Установить обновление? [y/N]: ' input
            if [[ "${input,,}" != y ]]; then
              info "Обновление отменено."
              return
            fi

            prepare_host
            check_dependencies
            remote_revision="$(fetch_release_revision "$latest_tag")"
            if ! git_as_project_owner -C "$INSTALL_DIR" diff --quiet HEAD "$remote_revision"; then
              source_changed=true
              changed_files="$(git_as_project_owner -C "$INSTALL_DIR" diff --name-only HEAD "$remote_revision")"
              source_requires_runtime_update "$changed_files" && needs_runtime=true
              source_requires_image_rebuild "$changed_files" && needs_build=true
              source_requires_database_backup "$changed_files" && needs_database_backup=true
              source_requires_proxy_update "$changed_files" && needs_proxy=true
            fi

            create_temporary_backup "$needs_database_backup"
            env_before="$TEMP_BACKUP_DIR/.env"

            if [[ "$source_changed" == true ]]; then
              if ! sync_existing_source "$remote_revision"; then
                recover_failed_update
              fi
              [[ "$(installed_project_version)" == "$latest_version" ]] || recover_failed_update
            fi

            ensure_sftp_env
            validate_env
            if ! cmp -s "$env_before" "$INSTALL_DIR/.env"; then
              env_changed=true
            fi

            if [[ "$source_changed" == false && "$env_changed" == false ]]; then
              rm -f -- "$LEGACY_PROJECT_REF_FILE"
              info "Изменения не требуются."
              return
            fi

            if [[ "$needs_proxy" == true ]]; then
              refresh_proxy || recover_failed_update
            fi

            if bootstrap_administrator_is_configured && administrator_is_persisted; then
              finalize_bootstrap_administrator
              env_changed=true
            fi

            if [[ "$needs_runtime" == false && "$env_changed" == false ]]; then
              if [[ "$needs_proxy" == true ]]; then
                info "Обновлена конфигурация HTTPS-прокси. Приложение и база данных не перезапускались."
              else
                info "Обновлены служебные файлы. Контейнеры и база данных не затрагивались."
              fi
              return
            fi

            if [[ "$needs_build" == true ]]; then
              build_and_start build false || recover_failed_update
            elif ! build_and_start apply false; then
              recover_failed_update
            fi
            rm -f -- "$LEGACY_PROJECT_REF_FILE"
            info "MIRA-TV обновлён до v$latest_version."
          }'''

          text, count = re.subn(
              r'update_app\(\) \{.*?\n\}\n\nreset_admin_password\(\) \{',
              new_update + '\n\nreset_admin_password() {',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('update_app replacement failed')

          text = text.replace('  log "Создание временной резервной копии исходников и .env"\n', '', 1)
          text = text.replace('    log "Создание резервной копии базы данных"\n', '', 1)
          text = text.replace('  info "Временный бэкап создан до изменения конфигурации и будет удалён после успешной операции."\n', '', 1)
          installer.write_text(text)
          PY

          cat > .github/workflows/release.yml <<'YAML'
          name: release

          on:
            workflow_run:
              workflows: [check]
              types: [completed]
              branches: [main]

          permissions:
            contents: write

          concurrency:
            group: stable-release
            cancel-in-progress: false

          jobs:
            publish:
              if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
              runs-on: ubuntu-latest
              steps:
                - name: Checkout verified main revision
                  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
                  with:
                    ref: __VERIFIED_SHA__
                    fetch-depth: 0

                - name: Verify release candidate
                  id: release
                  shell: bash
                  env:
                    VERIFIED_SHA: __VERIFIED_SHA__
                  run: |
                    set -euo pipefail

                    VERSION="$(node -p "require('./package.json').version")"
                    TAG="v${VERSION}"
                    test -n "$VERSION"
                    grep -F "## [${VERSION}]" CHANGELOG.md >/dev/null

                    git fetch origin main --depth=1
                    MAIN_SHA="$(git rev-parse origin/main)"
                    CURRENT_SHA="$(git rev-parse HEAD)"
                    test "$CURRENT_SHA" = "$VERIFIED_SHA"
                    test "$MAIN_SHA" = "$VERIFIED_SHA"

                    if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                      echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                    else
                      awk -v header="## [${VERSION}]" '
                        index($0, header) == 1 { capture=1; next }
                        capture && /^## \[/ { exit }
                        capture { print }
                      ' CHANGELOG.md > /tmp/release-notes.md
                      test -s /tmp/release-notes.md
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                      echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                    fi

                - name: Publish stable GitHub Release
                  if: steps.release.outputs.publish == 'true'
                  env:
                    GH_TOKEN: __GITHUB_TOKEN__
                    VERIFIED_SHA: __VERIFIED_SHA__
                    TAG: __RELEASE_TAG__
                  run: |
                    set -euo pipefail
                    gh release create "$TAG" \
                      --repo "$GITHUB_REPOSITORY" \
                      --target "$VERIFIED_SHA" \
                      --title "MIRA-TV $TAG" \
                      --notes-file /tmp/release-notes.md

                - name: Publish verified installer tag
                  env:
                    VERIFIED_SHA: __VERIFIED_SHA__
                  shell: bash
                  run: |
                    set -euo pipefail
                    SCRIPT_VERSION="$(sed -nE 's/^SCRIPT_VERSION="([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' menu-tv-2.sh | head -n 1)"
                    test -n "$SCRIPT_VERSION"
                    bash -n menu-tv-2.sh
                    INSTALLER_TAG="installer-v${SCRIPT_VERSION}"
                    test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
                    git fetch origin main --depth=1
                    test "$(git rev-parse origin/main)" = "$VERIFIED_SHA"
                    if git ls-remote --exit-code --tags origin "refs/tags/${INSTALLER_TAG}" >/dev/null 2>&1; then
                      exit 0
                    fi
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git tag "$INSTALLER_TAG" "$VERIFIED_SHA"
                    git push origin "refs/tags/${INSTALLER_TAG}"
          YAML

          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/release.yml')
          text = path.read_text()
          expr = '$' + '{{ github.event.workflow_run.head_sha }}'
          token = '$' + '{{ github.token }}'
          release_tag = '$' + '{{ steps.release.outputs.tag }}'
          text = text.replace('__VERIFIED_SHA__', expr)
          text = text.replace('__GITHUB_TOKEN__', token)
          text = text.replace('__RELEASE_TAG__', release_tag)
          path.write_text(text)
          PY

          cat > tests/installer-update-flow.test.js <<'JS'
          import assert from 'node:assert/strict';
          import { mkdtemp, mkdir, writeFile, rm, readFile } from 'node:fs/promises';
          import { spawnSync } from 'node:child_process';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { fileURLToPath } from 'node:url';
          import test from 'node:test';

          const installerPath = fileURLToPath(new URL('../menu-tv-2.sh', import.meta.url));
          const releaseWorkflowPath = fileURLToPath(new URL('../.github/workflows/release.yml', import.meta.url));

          test('update exits immediately when installed release is already current', async () => {
            const root = await mkdtemp(join(tmpdir(), 'mira-installer-current-'));
            try {
              await mkdir(join(root, '.git'));
              await writeFile(join(root, '.env'), 'TEST=1\n');
              const harness = String.raw`
                source "$1"
                INSTALL_DIR="$2"
                require_root() { :; }
                installed_project_version() { printf '1.9.0\n'; }
                latest_release_tag() { printf 'v1.9.0\n'; }
                prepare_host() { printf 'UNEXPECTED:prepare_host\n'; return 91; }
                check_dependencies() { printf 'UNEXPECTED:check_dependencies\n'; return 92; }
                fetch_release_revision() { printf 'UNEXPECTED:fetch_release_revision\n'; return 93; }
                create_temporary_backup() { printf 'UNEXPECTED:create_temporary_backup\n'; return 94; }
                update_app
              `;
              const result = spawnSync('bash', ['-c', harness, 'bash', installerPath, root], { encoding: 'utf8' });
              assert.equal(result.status, 0, result.stderr);
              assert.equal(result.stdout.trim(), 'MIRA-TV v1.9.0 уже актуален.');
              assert.doesNotMatch(result.stdout + result.stderr, /UNEXPECTED:/);
            } finally {
              await rm(root, { recursive: true, force: true });
            }
          });

          test('installer release channel is published only from the verified main SHA', async () => {
            const [installer, workflow] = await Promise.all([
              readFile(installerPath, 'utf8'),
              readFile(releaseWorkflowPath, 'utf8')
            ]);
            assert.match(installer, /^SCRIPT_VERSION="1\.3\.4"$/m);
            assert.match(installer, /fetch --quiet --depth 1 origin/);
            assert.match(workflow, /Publish verified installer tag/);
            assert.match(workflow, /INSTALLER_TAG="installer-v\$\{SCRIPT_VERSION\}"/);
            assert.match(workflow, /git push origin "refs\/tags\/\$\{INSTALLER_TAG\}"/);
            assert.match(workflow, /git rev-parse origin\/main/);
          });
          JS

          bash -n menu-tv-2.sh
          node --test tests/installer-update-flow.test.js

      - name: Commit generated fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_apply-installer-fast-path.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add menu-tv-2.sh .github/workflows/release.yml tests/installer-update-flow.test.js .github/workflows/_apply-installer-fast-path.yml
          git commit -m 'Optimize installer update fast path'
          git push origin HEAD:fix/installer-update-fast-path
