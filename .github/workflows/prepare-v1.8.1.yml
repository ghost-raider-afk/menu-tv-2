name: Prepare v1.8.1 metadata

on:
  push:
    branches:
      - fix/v1.8.1-player-pairing-mobile-qr
    paths:
      - .github/workflows/prepare-v1.8.1.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/v1.8.1-player-pairing-mobile-qr
          fetch-depth: 0
      - name: Bump patch metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('package.json'); s=p.read_text(); assert '\"version\": \"1.8.0\"' in s; p.write_text(s.replace('\"version\": \"1.8.0\"','\"version\": \"1.8.1\"',1))"
          python3 -c "from pathlib import Path; p=Path('package-lock.json'); s=p.read_text(); assert s.count('\"version\": \"1.8.0\"') >= 2; p.write_text(s.replace('\"version\": \"1.8.0\"','\"version\": \"1.8.1\"',2))"
          python3 -c "from pathlib import Path; p=Path('tests/versioning.test.js'); s=p.read_text(); assert \"assert.equal(pkg.version, '1.8.0');\" in s; p.write_text(s.replace(\"assert.equal(pkg.version, '1.8.0');\",\"assert.equal(pkg.version, '1.8.1');\",1))"
          rm .github/workflows/prepare-v1.8.1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json tests/versioning.test.js
          git add -u .github/workflows/prepare-v1.8.1.yml
          git commit -m 'Prepare MIRA-TV v1.8.1 metadata'
          git push origin HEAD:fix/v1.8.1-player-pairing-mobile-qr
