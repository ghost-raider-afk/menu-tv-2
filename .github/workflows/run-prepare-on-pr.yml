name: run-prepare-on-pr

on:
  pull_request:
    branches:
      - feature/device-player-activation

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'agent/consolidate-single-main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidate-single-main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Extract and run prepared migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/prepare-single-main.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          body = []
          for line in source[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          target = Path('/tmp/prepare_single_main.py')
          code = '\n'.join(body) + '\n'
          old = """if old_check not in workflow:\n    raise SystemExit('old installer CI contract not found')\nworkflow = workflow.replace(old_check, new_check, 1)"""
          new = """if old_check in workflow:\n    workflow = workflow.replace(old_check, new_check, 1)\nelse:\n    installer_check = re.compile(r'(?m)^      - name: Check installer ref\\n        run: \\|\\n(?:          .*\\n){3}')\n    workflow, check_count = installer_check.subn(new_check, workflow, count=1)\n    if check_count != 1:\n        raise SystemExit(f'old installer CI contract not found: {check_count}')"""
          if old not in code:
              raise SystemExit('migration patch anchor not found')
          target.write_text(code.replace(old, new, 1))
          PY
          python3 /tmp/prepare_single_main.py
          rm -f .github/workflows/run-prepare-on-pr.yml
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ['README.md', '.github/workflows/check.yml']:
              path = Path(name)
              path.write_text(path.read_text().rstrip() + '\n')
          test_path = Path('tests/versioning.test.js')
          test = test_path.read_text()
          test = re.sub(r"^    assert\.match\(changelog,.*$", "    assert.ok(changelog.includes(`## [${pkg.version}]`));", test, flags=re.M)
          test = re.sub(r"^    assert\.match\(installer, new RegExp\(.*$", "    assert.ok(installer.includes(`SCRIPT_VERSION=\\\"${pkg.version}\\\"`));", test, flags=re.M)
          test_path.write_text(test)
          PY
          bash -n menu-tv-2.sh
          git diff --check
          npm ci
          npm run check
      - name: Commit generated migration
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Adopt single-main release versioning'
          git push origin HEAD:agent/consolidate-single-main
