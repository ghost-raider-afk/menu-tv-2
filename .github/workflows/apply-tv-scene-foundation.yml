name: Apply TV scene foundation

on:
  push:
    branches:
      - feat/tv-scene-runtime-foundation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tv-scene-runtime-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply approved architecture and foundation
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply.py
          python3 /tmp/apply.py
      - name: Validate
        shell: bash
        run: |
          npm ci
          npm run build
          node --test tests/player-render-mode.test.js tests/tv-scene-runtime-ownership.test.js
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-tv-scene-foundation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build TV scene runtime foundation'
          git push origin HEAD:feat/tv-scene-runtime-foundation
