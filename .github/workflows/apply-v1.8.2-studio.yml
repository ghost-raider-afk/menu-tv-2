name: Finalize v1.8.2 branch

on:
  push:
    branches:
      - fix/v1.8.2-brand-entity-decoupling
    paths:
      - .github/workflows/apply-v1.8.2-studio.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/v1.8.2-brand-entity-decoupling
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Finalize release metadata, visual regression and cleanup
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.8.2 --no-git-tag-version
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Patch anchor not found in ${path}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          const versioningPath = 'tests/versioning.test.js';
          replaceExact(
            versioningPath,
            `test('MIRA-TV v1.8.0 release metadata is synchronized while legacy package identity remains compatible', async () => {`,
            `test('MIRA-TV v1.8.2 release metadata is synchronized while legacy package identity remains compatible', async () => {`
          );
          replaceExact(versioningPath, `assert.equal(pkg.version, '1.8.1');`, `assert.equal(pkg.version, '1.8.2');`);

          const changelogPath = 'CHANGELOG.md';
          const changelog = fs.readFileSync(changelogPath, 'utf8');
          if (!changelog.startsWith('## [1.8.1] - 2026-08-26')) throw new Error('Unexpected CHANGELOG head');
          const releaseNotes = `## [1.8.2] - 2026-08-27\n\n### Motion Studio\n- Страница «Анимация» переработана в отдельный основной раздел: live-preview расположен слева, компактный inspector справа, настройки разделены на «Меню», «Текст» и «Сцена».\n- Рабочий Studio-пресет отделён от live-настроек телевизоров: «Сохранить пресет» не меняет работающие экраны, а «Применить к выбранным» обновляет только выбранные мониторы.\n- Добавлено массовое применение к отдельным мониторам или ко всем выбранным экранам; каждый монитор хранит собственный snapshot в screen_animation_settings.\n\n### Brand / Player\n- MIRA-TV остаётся названием приложения, но больше не навязывается как пользовательский Brand; Brand можно очистить или заменить произвольным названием.\n- Brand рендерится отдельными glyph-элементами и получил entrance, loop и exit эффекты со stagger, amplitude, overshoot и независимыми длительностями.\n- Player сохраняет overlay DOM между периодическими refresh, поэтому entrance-анимация неизменившегося Brand больше не запускается заново.\n\n### Совместимость и данные\n- TV Player читает per-monitor animation snapshot; новые мониторы получают текущий Studio-пресет, а клонирование монитора или торговой точки сохраняет snapshot исходного экрана.\n- При обновлении существующей установки прежняя глобальная анимация переносится в существующие мониторы; NULL brand_json / aquarium_json канонизируются в пустые объекты.\n- Entity assets не удаляются, пока остаются связанными хотя бы с одним монитором; сохранена совместимость со старыми TV-браузерами и prefers-reduced-motion.\n- Исправлена запись updated_at в screen_animation_settings: timestamp формируется базой данных как timestamptz вместо передачи нетипизированной строки.\n\n### Проверки\n- Добавлены регрессии на независимость Save/Apply, выборочное применение, сохранение animation snapshot при клонировании, per-monitor Player и отсутствие повторного Brand entrance при обычном refresh.\n- Browser gate дополнительно фиксирует двухколоночную компоновку Motion Studio и расположение действий внутри inspector.\n\n`;
          fs.writeFileSync(changelogPath, releaseNotes + changelog);

          const browserPath = 'tests/browser/animation-studio.spec.js';
          replaceExact(
            browserPath,
            `    await page.goto(\`/animation.html?screen=\${fixture.screenId}\`);\n    await expect(page.getByRole('heading', { name: 'Живое меню' })).toBeVisible();`,
            `    await page.goto(\`/animation.html?screen=\${fixture.screenId}\`);\n    const previewPane = page.locator('.animation-preview-pane');\n    const inspector = page.locator('.animation-inspector');\n    const [previewBox, inspectorBox] = await Promise.all([previewPane.boundingBox(), inspector.boundingBox()]);\n    expect(previewBox).not.toBeNull();\n    expect(inspectorBox).not.toBeNull();\n    expect(previewBox.x).toBeLessThan(inspectorBox.x);\n    await expect(inspector.locator('.animation-inspector-tabs')).toContainText(['Меню', 'Текст', 'Сцена']);\n    await expect(inspector.locator('.animation-inspector-actions #animation-save')).toBeVisible();\n    await expect(inspector.locator('.animation-inspector-actions #animation-apply')).toBeVisible();\n    await expect(page.getByRole('heading', { name: 'Живое меню' })).toBeVisible();`
          );
          NODE

          rm -f \
            .github/workflows/apply-brand-entity-decoupling.yml \
            scripts/apply-brand-entity-decoupling.mjs \
            scripts/apply-v1.8.2-studio.mjs \
            scripts/fix-v1.8.2-screen-animation-seed.mjs \
            .github/workflows/apply-v1.8.2-studio.yml

          test ! -e .github/workflows/apply-brand-entity-decoupling.yml
          test ! -e .github/workflows/apply-v1.8.2-studio.yml
          test ! -e scripts/apply-brand-entity-decoupling.mjs
          test ! -e scripts/apply-v1.8.2-studio.mjs
          test ! -e scripts/fix-v1.8.2-screen-animation-seed.mjs
      - name: Validate final branch
        run: |
          npm ci
          npm run check
          git diff --check
      - name: Commit release preparation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Prepare MIRA-TV v1.8.2 release'
          git push origin HEAD:fix/v1.8.2-brand-entity-decoupling
