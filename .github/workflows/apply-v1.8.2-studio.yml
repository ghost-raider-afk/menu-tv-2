name: Apply Motion Studio v1.8.2

on:
  push:
    branches:
      - fix/v1.8.2-brand-entity-decoupling
    paths:
      - .github/workflows/apply-v1.8.2-studio.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.8.2-brand-entity-decoupling
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply studio patch
        run: |
          sed -i 's/${ENTITY_DIR}\/${previousFile}/\\${ENTITY_DIR}\/\\${previousFile}/' scripts/apply-v1.8.2-studio.mjs
          node scripts/apply-v1.8.2-studio.mjs
      - name: Validate syntax and unit tests
        run: |
          npm ci
          npm run check
          git diff --check
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests
          git commit -m 'Redesign Motion Studio and add per-screen animation deployment'
          git push origin HEAD:fix/v1.8.2-brand-entity-decoupling
