name: patch-schema

on:
  push:
    branches:
      - agent/backend-modularization

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/backend-modularization
      - name: Make dangling-template cleanup portable
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/db/migrations/schema.js')
          s = p.read_text()
          old = """    UPDATE screens SET template_id = NULL
      WHERE template_id IS NOT NULL AND NOT EXISTS (SELECT 1 FROM templates t WHERE t.id = screens.template_id);"""
          new = """    UPDATE screens SET template_id = NULL
      WHERE template_id IS NOT NULL AND template_id NOT IN (SELECT id FROM templates);"""
          if old not in s:
              raise SystemExit('expected migration fragment not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check src/db/migrations/schema.js
      - name: Commit migration fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/db/migrations/schema.js
          git commit -m 'Make dangling template cleanup portable'
          git push origin HEAD:agent/backend-modularization
