name: Apply v1.8.1 review fixes

on:
  push:
    branches:
      - fix/v1.8.1-player-pairing-mobile-qr
    paths:
      - .github/workflows/apply-v181-review.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.8.1-player-pairing-mobile-qr
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply review fixes
        run: node scripts/apply-v181-review-fixes.mjs
      - name: Validate syntax and tests
        run: |
          npm ci
          npm run check
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web/admin-ui/public/js/player/player.js src/web/admin-ui/public/js/pages/connect-tv.js src/web/admin-ui/public/css/player.css tests/browser/player-refresh-resilience.spec.js tests/browser/connect-tv-mobile.spec.js tests/device-player-architecture.test.js
          git commit -m 'Fix v1.8.1 player bootstrap lifecycle'
          git push origin HEAD:fix/v1.8.1-player-pairing-mobile-qr
