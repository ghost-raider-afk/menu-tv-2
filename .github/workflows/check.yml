name: check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/adversarial-hardening-1.4
          fetch-depth: 0
      - name: Restore verified lock and v1.3.1 metadata
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:package-lock.json > package-lock.json
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = '1.3.1';
          lock.packages[''].version = '1.3.1';
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
          python3 <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          changelog.write_text(changelog.read_text().replace('## [1.4.0] - 2026-08-23', '## [1.3.1] - 2026-08-23', 1))

          installer = Path('menu-tv-2.sh')
          text = installer.read_text().replace('SCRIPT_VERSION="1.4.0"', 'SCRIPT_VERSION="1.3.1"', 1)
          anchor = '  delete_env_value "$env_file" TEMPLATE_BACKGROUND_MAX_BYTES\n'
          additions = '  delete_env_value "$env_file" FRONTEND_ERROR_RETENTION_DAYS\n  delete_env_value "$env_file" FRONTEND_ERROR_MAX_ENTRIES\n'
          if 'delete_env_value "$env_file" FRONTEND_ERROR_RETENTION_DAYS' not in text:
              text = text.replace(anchor, anchor + additions, 1)
          installer.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json CHANGELOG.md menu-tv-2.sh
          git diff --cached --quiet && exit 0
          git commit -m 'Repair v1.3.1 release metadata and dependency lock'
          git push origin HEAD:agent/adversarial-hardening-1.4
