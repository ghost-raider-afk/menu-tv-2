name: repair-v17-lock

on:
  push:
    branches: [work/v1.7.0-mira]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout work branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: work/v1.7.0-mira
          fetch-depth: 0
      - name: Restore canonical lock and bump only release version
        shell: bash
        run: |
          set -euo pipefail
          git show fb0a3bc2bbb165101d4658d133092f31f062a0fe:package-lock.json > package-lock.json
          python - <<'PY'
          from pathlib import Path
          path = Path('package-lock.json')
          text = path.read_text()
          old = '"version": "1.6.0"'
          if text.count(old) < 2:
              raise SystemExit('canonical lock does not contain both 1.6.0 version fields')
          path.write_text(text.replace(old, '"version": "1.7.0"', 2))
          PY
          git diff --check -- package-lock.json
          test "$(git diff --numstat -- package-lock.json)" = $'2\t2\tpackage-lock.json'
      - name: Commit repaired lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m 'Repair v1.7.0 package lock from canonical v1.6.0'
          git push origin HEAD:work/v1.7.0-mira
