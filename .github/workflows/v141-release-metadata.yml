name: v1.4.1 release metadata
on:
  push:
    branches: [release/v1.4.1]
permissions:
  contents: write
jobs:
  update-release-metadata:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update CI and changelog
        run: |
          python - <<'PY'
          from pathlib import Path
          check = Path('.github/workflows/check.yml')
          s = check.read_text()
          s = s.replace("DEVICE_ACTIVATION_TTL_MINUTES: '10'", "DEVICE_ACTIVATION_TTL_MINUTES: '2'")
          check.write_text(s)

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text()
          marker = '# История версий ТВ МЕНЮ 2\n\n'
          section = '''## [1.4.1] - 2026-08-24\n\n### Подключение ТВ\n- Срок жизни QR-кода и резервного 6-значного кода сокращён с 10 до 2 минут; значение остаётся управляемым через `DEVICE_ACTIVATION_TTL_MINUTES`.\n- На экране ТВ добавлен живой обратный отсчёт по серверному `expires_at`; после истечения QR и резервный код скрываются и автоматически заменяются новой активацией.\n- При временной потере связи просроченный QR не отображается как действующий; Player повторяет получение новой активации после восстановления соединения.\n- Мобильная страница администратора переработана в последовательный flow «ТВ → Торговая точка → Монитор» с крупными touch-targets и одним активным шагом.\n- QR-сканер открывается полноэкранно; используется нативный `BarcodeDetector`, а для Safari/iPhone добавлен локальный fallback на `jsQR` без внешнего CDN.\n- Резервный код оставлен как понятный fallback «Не получается отсканировать? Ввести код».\n\n### Обновление\n- Installer `1.3.3` переводит только прежнее каноническое значение `DEVICE_ACTIVATION_TTL_MINUTES=10` на `2`, сохраняя явно настроенные пользователем нестандартные значения.\n- Добавлены unit/browser regressions мобильного flow, fullscreen scanner, Safari fallback, countdown и автоматической ротации QR.\n\n'''
          if '## [1.4.1]' not in c:
              c = c.replace(marker, marker + section, 1)
          changelog.write_text(c)
          PY
      - name: Commit release metadata
        run: |
          if git diff --quiet -- .github/workflows/check.yml CHANGELOG.md; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/check.yml CHANGELOG.md
          git commit -m "Document v1.4.1 pairing security patch"
          git push
