# migration-trigger-2
name: prepare-single-main

on:
  push:
    branches:
      - agent/consolidate-single-main
    paths:
      - .github/workflows/prepare-single-main.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/consolidate-single-main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply release and installer migration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          VERSION = '1.3.0'
          root = Path('.')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text())
          package['version'] = VERSION
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          lock_path = root / 'package-lock.json'
          lock = json.loads(lock_path.read_text())
          lock['version'] = VERSION
          if isinstance(lock.get('packages'), dict) and isinstance(lock['packages'].get(''), dict):
              lock['packages']['']['version'] = VERSION
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n')

          changelog = f'''# История версий ТВ МЕНЮ 2

          ## [{VERSION}] - 2026-08-23

          ### Добавлено
          - Подключение телевизора через QR-код и 6-значный резервный код с долгоживущей Device Session.
          - Offline-first TV Player: ранее подключённый монитор продолжает показывать сохранённое меню при потере Интернета.
          - Двухэтапный CSV-импорт базы продукции с предпросмотром, исправлением строк на лету и атомарным применением.

          ### Исправлено
          - Плашка «Акция» собирается как единая SVG-группа, чтобы фон и надпись масштабировались одной структурой.
          - Тестовый контракт Device Player разделяет имя монитора и метку устройства.
          - Тестовое окружение включает обязательные DEVICE_* параметры.

          ### Инфраструктура
          - Единственная постоянная ветка проекта — `main`.
          - Версия проекта берётся из `package.json`.
          - Стабильные версии публикуются тегом `vX.Y.Z` и GitHub Release только после полного CI.
          - После успешного релиза GitHub Actions удаляет все ветки, кроме `main`.
          - Установщик и обновлятор используют последний стабильный GitHub Release, а не HEAD ветки.
          '''
          (root / 'CHANGELOG.md').write_text(changelog.replace('          ', ''))

          script_path = root / 'menu-tv-2.sh'
          script = script_path.read_text()
          script = script.replace('SCRIPT_VERSION="1.2.0"', f'SCRIPT_VERSION="{VERSION}"', 1)
          old_header = '''PROJECT_REF_FILE="$INSTALL_DIR/.installer-ref"
          BRANCH="${MENU_TV_REF:-}"
          if [[ -z "$BRANCH" && -r "$PROJECT_REF_FILE" ]]; then
            BRANCH="$(head -n 1 "$PROJECT_REF_FILE")"
          fi
          BRANCH="${BRANCH:-main}"
          SCRIPT_RAW_URL="https://raw.githubusercontent.com/ghost-raider-afk/menu-tv-2/$BRANCH/menu-tv-2.sh"'''.replace('          ', '')
          new_header = '''LEGACY_PROJECT_REF_FILE="$INSTALL_DIR/.installer-ref"
          GITHUB_REPO="ghost-raider-afk/menu-tv-2"
          GITHUB_API_URL="https://api.github.com/repos/$GITHUB_REPO"
          GITHUB_RAW_URL="https://raw.githubusercontent.com/$GITHUB_REPO"'''.replace('          ', '')
          if old_header not in script:
              raise SystemExit('installer header contract not found')
          script = script.replace(old_header, new_header, 1)

          helper_anchor = 'command_exists() { command -v "$1" >/dev/null 2>&1; }\n'
          helpers = r'''

          project_version_from_file() {
            local file="$1" version
            version="$(sed -nE 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"([0-9]+(\.[0-9]+){2})",?[[:space:]]*$/\1/p' "$file" | head -n 1)"
            [[ -n "$version" ]] || return 1
            printf '%s\n' "$version"
          }

          installed_project_version() {
            project_version_from_file "$INSTALL_DIR/package.json"
          }

          release_tag_version() {
            local tag="$1"
            [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || return 1
            printf '%s\n' "${BASH_REMATCH[1]}"
          }

          version_is_newer() {
            local current="$1" candidate="$2"
            [[ "$current" != "$candidate" ]] || return 1
            [[ "$(printf '%s\n%s\n' "$current" "$candidate" | sort -V | tail -n 1)" == "$candidate" ]]
          }

          latest_release_tag() {
            local payload tag
            command_exists curl || return 1
            payload="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/releases/latest")" || return 1
            tag="$(printf '%s\n' "$payload" | sed -nE 's/.*"tag_name"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' | head -n 1)"
            release_tag_version "$tag" >/dev/null || return 1
            printf '%s\n' "$tag"
          }
          '''.replace('          ', '')
          if helper_anchor not in script:
              raise SystemExit('command_exists anchor not found')
          script = script.replace(helper_anchor, helper_anchor + helpers, 1)

          def replace_function(text, name, replacement):
              pattern = re.compile(rf'(?ms)^{re.escape(name)}\(\) \{{\n.*?^\}}\n')
              updated, count = pattern.subn(replacement.rstrip() + '\n', text, count=1)
              if count != 1:
                  raise SystemExit(f'function {name} not found exactly once: {count}')
              return updated

          script = replace_function(script, 'fetch_latest_script', r'''
          fetch_latest_script() {
            local destination="$1" release_tag raw_url
            command_exists curl || { warn "Для проверки обновлений нужен curl."; return 1; }
            release_tag="$(latest_release_tag)" || return 1
            raw_url="$GITHUB_RAW_URL/$release_tag/menu-tv-2.sh"
            curl -fsSL --connect-timeout 10 --max-time 60 "$raw_url" -o "$destination" || return 1
            bash -n "$destination" && script_version_from_file "$destination" >/dev/null
          }
          '''.replace('          ', ''))

          merge_env_fn = r'''
          merge_missing_env_from_example() {
            local env_file="$INSTALL_DIR/.env" example_file="$INSTALL_DIR/.env.example" line key value
            [[ -f "$env_file" ]] || die "Отсутствует $env_file"
            [[ -f "$example_file" ]] || die "Отсутствует $example_file"
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ "$line" =~ ^[A-Z][A-Z0-9_]*= ]] || continue
              key="${line%%=*}"
              value="${line#*=}"
              if ! grep -q "^${key}=" "$env_file"; then
                printf '\n%s=%s\n' "$key" "$value" >> "$env_file"
                info "Добавлен новый параметр .env: $key"
              fi
            done < "$example_file"
          }

          '''.replace('          ', '')
          ensure_pos = script.find('ensure_sftp_env() {')
          if ensure_pos < 0:
              raise SystemExit('ensure_sftp_env anchor not found')
          script = script[:ensure_pos] + merge_env_fn + script[ensure_pos:]

          script = replace_function(script, 'ensure_sftp_env', r'''
          ensure_sftp_env() {
            local env_file="$INSTALL_DIR/.env" domain app_name
            [[ -f "$env_file" ]] || die "Отсутствует $env_file"
            merge_missing_env_from_example
            domain="$(env_value MENU_TV_2_DOMAIN "$env_file")"
            [[ -n "$domain" ]] || die "MENU_TV_2_DOMAIN в .env не настроен."

            app_name="$(env_value APP_NAME "$env_file")"
            if [[ -z "$app_name" || "$app_name" == "Menu TV 2.0" ]]; then
              set_env_value "$env_file" APP_NAME "ТВ МЕНЮ"
            fi
            delete_env_value "$env_file" TEMPLATE_BACKGROUND_MAX_BYTES

            [[ -n "$(env_value SFTP_PUBLIC_HOST "$env_file")" ]] || set_env_value "$env_file" SFTP_PUBLIC_HOST "$domain"
            if [[ -z "$(env_value POSTGRES_PASSWORD "$env_file")" || "$(env_value POSTGRES_PASSWORD "$env_file")" == replace-with-* ]]; then
              set_env_value "$env_file" POSTGRES_PASSWORD "$(random_secret 24)"
              info "Создан отсутствующий секрет PostgreSQL."
            fi
            if [[ -z "$(env_value SESSION_SECRET "$env_file")" || "$(env_value SESSION_SECRET "$env_file")" == replace-with-* ]]; then
              set_env_value "$env_file" SESSION_SECRET "$(random_secret 48)"
              info "Создан отсутствующий секрет сессии."
            fi
            if [[ -z "$(env_value SFTP_ADMIN_PASSWORD "$env_file")" || "$(env_value SFTP_ADMIN_PASSWORD "$env_file")" == replace-with-* ]]; then
              set_env_value "$env_file" SFTP_ADMIN_PASSWORD "$(random_secret 32)"
              info "Создан отсутствующий секрет внутреннего SFTP-сервиса."
            fi
            chown root:root "$env_file"
            chmod 600 "$env_file"
          }
          '''.replace('          ', ''))

          script = replace_function(script, 'fetch_remote_revision', r'''
          fetch_release_revision() {
            local release_tag="$1"
            git_as_project_owner -C "$INSTALL_DIR" fetch --depth 1 origin "refs/tags/$release_tag"
            git_as_project_owner -C "$INSTALL_DIR" rev-parse FETCH_HEAD
          }
          '''.replace('          ', ''))

          script = replace_function(script, 'install_app', r'''
          install_app() {
            require_root
            local domain acme_email owner stage_dir release_tag release_version
            [[ ! -e "$INSTALL_DIR" ]] || die "Каталог $INSTALL_DIR уже существует. Для установленного приложения используйте обновление."
            prepare_host
            check_dependencies
            release_tag="$(latest_release_tag)" || die "Не удалось определить последний стабильный GitHub Release."
            release_version="$(release_tag_version "$release_tag")"
            domain="$(ask_for_domain)"
            acme_email="$(ask_for_acme_email)"
            owner="$(project_owner)"
            id "$owner" >/dev/null 2>&1 || die "Не найден пользователь, запустивший sudo: $owner"
            log "Загрузка стабильного релиза $release_tag"
            stage_dir="$(mktemp -d -t "${PROGRAM_NAME}.install.XXXXXX")"
            chown "$owner:$owner" "$stage_dir"
            git_as_project_owner clone --depth 1 --branch "$release_tag" --single-branch "$REPO_URL" "$stage_dir/source"
            printf '%s\n' "$owner" > "$stage_dir/source/.installer-owner"
            rm -f -- "$stage_dir/source/.installer-ref"
            mv "$stage_dir/source" "$INSTALL_DIR"
            rmdir "$stage_dir"
            [[ "$(installed_project_version)" == "$release_version" ]] || die "Версия package.json не соответствует тегу $release_tag."
            write_new_env "$domain"
            repair_permissions full
            install_launcher
            if ! setup_proxy "$acme_email" || ! build_and_start; then
              cleanup_failed_install
              die "Установка не завершилась. Исправьте ошибку и запустите установку заново."
            fi
            show_credentials
          }
          '''.replace('          ', ''))

          script = replace_function(script, 'update_app', r'''
          update_app() {
            local env_before current_version latest_tag latest_version remote_revision changed_files input
            local source_changed=false env_changed=false needs_runtime=false needs_build=false needs_database_backup=false
            require_root
            [[ -d "$INSTALL_DIR/.git" ]] || die "Menu TV 2.0 не установлен: $INSTALL_DIR"
            current_version="$(installed_project_version)" || die "Не удалось определить установленную версию из package.json."
            latest_tag="$(latest_release_tag)" || die "Не удалось определить последний стабильный GitHub Release."
            latest_version="$(release_tag_version "$latest_tag")"

            printf 'Установленная версия: %s\n' "$current_version"
            printf 'Доступная версия:     %s\n' "$latest_version"
            if version_is_newer "$current_version" "$latest_version"; then
              read -r -p "Обновить ТВ МЕНЮ 2 до версии $latest_version? [y/N]: " input
              if [[ "${input,,}" != y ]]; then
                info "Обновление отменено."
                return
              fi
            elif version_is_newer "$latest_version" "$current_version"; then
              warn "Установленная версия $current_version новее последнего опубликованного релиза $latest_version. Автоматическое понижение версии запрещено."
              return
            fi

            prepare_host
            check_dependencies
            env_before="$(mktemp -t "${PROGRAM_NAME}.env.XXXXXX")"
            cp "$INSTALL_DIR/.env" "$env_before"
            ensure_sftp_env
            validate_env
            if ! cmp -s "$env_before" "$INSTALL_DIR/.env"; then
              env_changed=true
            fi
            rm -f -- "$env_before"

            log "Проверка стабильного релиза $latest_tag"
            remote_revision="$(fetch_release_revision "$latest_tag")"
            if ! git_as_project_owner -C "$INSTALL_DIR" diff --quiet HEAD "$remote_revision"; then
              source_changed=true
              if [[ "$current_version" == "$latest_version" ]]; then
                read -r -p "Исходники отличаются от опубликованного $latest_tag. Восстановить стабильный релиз? [y/N]: " input
                if [[ "${input,,}" != y ]]; then
                  info "Выравнивание с опубликованным релизом отменено."
                  return
                fi
              fi
              changed_files="$(git_as_project_owner -C "$INSTALL_DIR" diff --name-only HEAD "$remote_revision")"
              source_requires_runtime_update "$changed_files" && needs_runtime=true
              source_requires_image_rebuild "$changed_files" && needs_build=true
              source_requires_database_backup "$changed_files" && needs_database_backup=true
            fi

            if [[ "$source_changed" == false && "$env_changed" == false ]]; then
              rm -f -- "$LEGACY_PROJECT_REF_FILE"
              info "Установлен актуальный стабильный релиз $latest_tag."
              return
            fi

            if [[ "$source_changed" == true ]]; then
              if [[ "$needs_runtime" == true ]]; then
                create_temporary_backup "$needs_database_backup"
              fi
              if ! sync_existing_source "$remote_revision"; then
                die "Не удалось применить релиз $latest_tag."
              fi
              [[ "$(installed_project_version)" == "$latest_version" ]] || recover_failed_update
            fi

            if bootstrap_administrator_is_configured && administrator_is_persisted; then
              finalize_bootstrap_administrator
              env_changed=true
            fi

            if [[ "$needs_runtime" == false && "$env_changed" == false ]]; then
              info "Обновлены служебные файлы до $latest_tag. Контейнеры, база данных и HTTPS не затрагивались."
              return
            fi

            if [[ "$needs_build" == true ]]; then
              build_and_start build false || recover_failed_update
            elif ! build_and_start apply false; then
              recover_failed_update
            fi
            rm -f -- "$LEGACY_PROJECT_REF_FILE"
            info "Обновление до $latest_tag прошло проверку. HTTPS-сертификат не перевыпускался."
          }
          '''.replace('          ', ''))

          script = replace_function(script, 'status_app', r'''
          status_app() {
            local current_version latest_tag latest_version
            require_root
            [[ -d "$INSTALL_DIR" ]] || die "Menu TV 2.0 не установлен."
            current_version="$(installed_project_version 2>/dev/null || printf 'unknown')"
            printf 'Installation: %s\n' "$INSTALL_DIR"
            printf 'Version: %s\n' "$current_version"
            if latest_tag="$(latest_release_tag 2>/dev/null)"; then
              latest_version="$(release_tag_version "$latest_tag")"
              printf 'Latest release: %s\n' "$latest_version"
            else
              printf 'Latest release: unavailable\n'
            fi
            printf 'Revision: '
            git -C "$INSTALL_DIR" rev-parse --short HEAD 2>/dev/null || printf 'unknown'
            printf '\nContainers:\n'
            docker ps --filter "name=^/${APP_CONTAINER}$" --filter "name=^/${DB_CONTAINER}$" --filter "name=^/${SFTP_CONTAINER}$" --format '  {{.Names}}  {{.Status}}  {{.Image}}'
            printf 'Health: '
            verify_application >/dev/null 2>&1 && printf 'OK\n' || printf 'FAILED\n'
            printf 'SFTP: '
            verify_sftp >/dev/null 2>&1 && printf 'OK\n' || printf 'FAILED\n'
          }
          '''.replace('          ', ''))

          script = script.replace('Ветка/реф: $BRANCH', 'Канал обновлений: стабильные GitHub Releases')
          script = script.replace("  credentials_box_value 'Ветка/реф' \"$BRANCH\" ''", "  credentials_box_value 'Версия проекта' \"$(installed_project_version)\" ''")
          script = script.replace("    printf ' Ветка/реф: %s\\n' \"$BRANCH\"", "    printf ' Версия проекта: %s\\n' \"$(installed_project_version 2>/dev/null || printf 'не установлена')\"")
          script = script.replace("git_as_project_owner -C \"$INSTALL_DIR\" clean -fd -e .env -e .installer-owner -e .installer-ref", "git_as_project_owner -C \"$INSTALL_DIR\" clean -fd -e .env -e .installer-owner\n  rm -f -- \"$LEGACY_PROJECT_REF_FILE\"")
          script = script.replace('for tool in docker git tar openssl awk sed find install mktemp runuser od tr fold shuf dig cmp; do', 'for tool in docker git tar openssl awk sed find install mktemp runuser od tr fold shuf dig cmp sort; do')

          if 'MENU_TV_REF' in script or '\nBRANCH=' in script or '$BRANCH' in script:
              raise SystemExit('legacy branch-based updater remains in installer')
          script_path.write_text(script)

          readme_path = root / 'README.md'
          readme = readme_path.read_text()
          versioning = '''

          ## Версии и релизы

          ТВ МЕНЮ 2 использует одну постоянную ветку `main`. Рабочие ветки допускаются только как краткоживущие ветки для проверки PR и удаляются после успешного слияния.

          Единственный номер версии приложения хранится в `package.json`. После полного CI публикация `main` автоматически создаёт тег `vX.Y.Z` и GitHub Release, если такой версии ещё нет. Установщик и обновлятор используют только последний опубликованный Release и никогда не устанавливают случайный HEAD ветки.
          '''.replace('          ', '')
          if '## Версии и релизы' not in readme:
              readme_path.write_text(readme.rstrip() + versioning + '\n')

          test_path = root / 'tests' / 'versioning.test.js'
          test_path.write_text(r'''import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import test from 'node:test';

          test('project version has one canonical semantic version and release automation', async () => {
            const [packageText, lockText, installer, changelog, workflow] = await Promise.all([
              readFile(new URL('../package.json', import.meta.url), 'utf8'),
              readFile(new URL('../package-lock.json', import.meta.url), 'utf8'),
              readFile(new URL('../menu-tv-2.sh', import.meta.url), 'utf8'),
              readFile(new URL('../CHANGELOG.md', import.meta.url), 'utf8'),
              readFile(new URL('../.github/workflows/check.yml', import.meta.url), 'utf8')
            ]);
            const pkg = JSON.parse(packageText);
            const lock = JSON.parse(lockText);
            assert.match(pkg.version, /^\d+\.\d+\.\d+$/);
            assert.equal(lock.version, pkg.version);
            assert.equal(lock.packages?.['']?.version, pkg.version);
            assert.match(changelog, new RegExp(`^## \\[${pkg.version.replaceAll('.', '\\\\.')}\\]`, 'm'));
            assert.match(installer, new RegExp(`^SCRIPT_VERSION="${pkg.version.replaceAll('.', '\\\\.')}"$`, 'm'));
            assert.doesNotMatch(installer, /MENU_TV_REF|\$BRANCH|^BRANCH=/m);
            assert.match(installer, /releases\/latest/);
            assert.match(workflow, /release-and-cleanup:/);
            assert.match(workflow, /gh release create/);
            assert.match(workflow, /git push origin --delete/);
          });
          '''.replace('          ', ''))

          workflow_path = root / '.github' / 'workflows' / 'check.yml'
          workflow = workflow_path.read_text()
          old_check = '''      - name: Check installer ref
                  run: |
                    TEST_REF="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
                    MENU_TV_REF="$TEST_REF" bash menu-tv-2.sh help | grep -F "Ветка/реф: $TEST_REF"
                    MENU_TV_REF="$TEST_REF" bash menu-tv-2.sh help | grep -F 'Версия скрипта: 1.2.0'
          '''.replace('          ', '')
          new_check = f'''      - name: Check stable release installer
                  run: |
                    bash menu-tv-2.sh help | grep -F 'Канал обновлений: стабильные GitHub Releases'
                    bash menu-tv-2.sh help | grep -F 'Версия скрипта: {VERSION}'
                    ! grep -q 'MENU_TV_REF' menu-tv-2.sh
                    ! grep -q '^BRANCH=' menu-tv-2.sh
          '''.replace('          ', '')
          if old_check not in workflow:
              raise SystemExit('old installer CI contract not found')
          workflow = workflow.replace(old_check, new_check, 1)
          release_job = r'''

            release-and-cleanup:
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              needs:
                - node-check
                - browser-visual
                - clean-install-smoke
              runs-on: ubuntu-latest
              timeout-minutes: 10
              permissions:
                contents: write
              steps:
                - name: Checkout verified main
                  uses: actions/checkout@v4
                  with:
                    fetch-depth: 0
                - name: Resolve canonical version
                  id: version
                  shell: bash
                  run: |
                    VERSION="$(node -p "require('./package.json').version")"
                    LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
                    ROOT_LOCK_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
                    [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
                    [[ "$LOCK_VERSION" == "$VERSION" ]]
                    [[ "$ROOT_LOCK_VERSION" == "$VERSION" ]]
                    grep -F "## [$VERSION]" CHANGELOG.md
                    echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                    echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
                - name: Publish immutable GitHub Release
                  env:
                    GH_TOKEN: ${{ github.token }}
                    TAG: ${{ steps.version.outputs.tag }}
                  shell: bash
                  run: |
                    if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
                      echo "Release tag $TAG already exists; no new release is created."
                    else
                      gh release create "$TAG" --target "$GITHUB_SHA" --title "TV Menu 2 $TAG" --generate-notes
                    fi
                - name: Remove every branch except main
                  shell: bash
                  run: |
                    git ls-remote --heads origin | while read -r _ ref; do
                      branch="${ref#refs/heads/}"
                      [[ "$branch" == main ]] && continue
                      echo "Deleting obsolete branch: $branch"
                      git push origin --delete "$branch"
                    done
          '''.replace('          ', '')
          if 'release-and-cleanup:' not in workflow:
              workflow = workflow.rstrip() + release_job + '\n'
          workflow_path.write_text(workflow)

          Path('.github/workflows/prepare-single-main.yml').unlink()
          PY
      - name: Validate generated source
        run: |
          bash -n menu-tv-2.sh
          git diff --check
          npm ci
          npm run check
      - name: Commit prepared release scheme
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Adopt single-main release versioning'
