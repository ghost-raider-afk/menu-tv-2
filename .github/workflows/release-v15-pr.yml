name: release-v15-pr

on:
  pull_request:
    types: [opened]

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'publish-final/v1.5.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel duplicate check workflow
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          gh run list --repo "$GITHUB_REPOSITORY" --workflow check.yml --limit 30 --json databaseId,headSha,status,event --jq ".[] | select(.headSha == \"$HEAD_SHA\" and .event == \"pull_request\" and .status != \"completed\") | .databaseId" | while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish immutable v1.5.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = '1.5.0'
          test "$(node -p "require('./package-lock.json').version")" = '1.5.0'
          grep -F '## [1.5.0] - 2026-08-24' CHANGELOG.md
          TARGET_SHA="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin refs/tags/v1.5.0 >/dev/null 2>&1; then
            git fetch --force origin refs/tags/v1.5.0:refs/tags/v1.5.0
            test "$(git rev-list -n 1 v1.5.0)" = "$TARGET_SHA"
          else
            gh release create v1.5.0 --target "$TARGET_SHA" --title 'TV Menu 2 v1.5.0' --generate-notes
          fi
          SCRIPT_VERSION="$(sed -nE 's/^SCRIPT_VERSION="([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' menu-tv-2.sh | head -n 1)"
          INSTALLER_TAG="installer-v${SCRIPT_VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$INSTALLER_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$INSTALLER_TAG:refs/tags/$INSTALLER_TAG"
            cmp -s menu-tv-2.sh <(git show "$INSTALLER_TAG:menu-tv-2.sh")
          else
            git tag "$INSTALLER_TAG" "$TARGET_SHA"
            git push origin "refs/tags/$INSTALLER_TAG"
          fi
      - name: Close and remove trigger branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch || true
