name: apply-brand-multiline

on:
  push:
    branches:
      - feat/brand-multiline-text

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/brand-multiline-text
          fetch-depth: 0
      - name: Apply multiline Brand implementation
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/apply_brand_multiline.py
          python /tmp/apply_brand_multiline.py
          node --check src/contracts/brand-title.js
          node --check src/web/admin-ui/public/js/motion/brand-title.js
          node --test tests/brand-title-multiline.test.js
          git diff --check
      - name: Commit implementation and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-brand-multiline.yml
          git add src/web/admin-ui/public/animation.html src/contracts/brand-title.js src/web/admin-ui/public/js/motion/brand-title.js src/web/admin-ui/public/css/brand-motion-v2.css tests/browser/brand-title-editing.spec.js tests/brand-title-multiline.test.js
          git commit -m "Add multiline Brand text"
          git push origin HEAD:feat/brand-multiline-text