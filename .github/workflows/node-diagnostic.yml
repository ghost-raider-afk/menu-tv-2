name: node-diagnostic
on:
  push:
    branches: [agent/backend-modularization]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: agent/backend-modularization }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - shell: bash
        run: |
          set +e
          { echo "HEAD=$(git rev-parse HEAD)"; npm ci; echo "npm_ci_status=$?"; npm run check; echo "npm_check_status=$?"; } > ci-node-diagnostic.txt 2>&1
          exit 0
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-node-diagnostic.txt
          git commit -m 'Record node diagnostic output'
          git push origin HEAD:agent/backend-modularization
