<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>ТВ МЕНЮ</title>
  </head>
  <body
    x-data="{ page: 'overview', loaded: true, darkMode: false, sidebarToggle: false }"
    x-init="darkMode = JSON.parse(localStorage.getItem('darkMode') || 'false'); $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{ 'dark bg-gray-900': darkMode }"
  >
    <include src="./partials/preloader.html"></include>

    <div class="flex h-screen overflow-hidden">
      <include src="./partials/sidebar.html"></include>

      <div class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto">
        <include src="./partials/overlay.html"></include>
        <include src="./partials/header.html"></include>

        <main class="flex-1">
          <div class="mx-auto max-w-(--breakpoint-2xl) p-4 md:p-6">
            <section class="rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03] md:p-8">
              <p class="mb-3 text-sm font-medium text-brand-500">ПАНЕЛЬ УПРАВЛЕНИЯ</p>
              <h1 class="text-3xl font-semibold tracking-tight text-gray-900 dark:text-white md:text-4xl">ТВ МЕНЮ</h1>
              <p class="mt-3 max-w-2xl text-theme-sm text-gray-500 dark:text-gray-400 md:text-base">
                Управление контентом для экранов торговых точек: точки, мониторы, шаблоны и публикации.
              </p>
            </section>

            <section class="mt-6 grid gap-4 md:grid-cols-3 md:gap-6" aria-label="Разделы системы">
              <article class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
                <p class="text-sm text-gray-500 dark:text-gray-400">Торговые точки</p>
                <p class="mt-2 text-lg font-semibold text-gray-900 dark:text-white">Организация экранов по точкам</p>
              </article>
              <article class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
                <p class="text-sm text-gray-500 dark:text-gray-400">Мониторы</p>
                <p class="mt-2 text-lg font-semibold text-gray-900 dark:text-white">Настройка и публикация меню</p>
              </article>
              <article class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03]">
                <p class="text-sm text-gray-500 dark:text-gray-400">SFTP</p>
                <p class="mt-2 text-lg font-semibold text-gray-900 dark:text-white">Доставка файлов на телевизоры</p>
              </article>
            </section>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
