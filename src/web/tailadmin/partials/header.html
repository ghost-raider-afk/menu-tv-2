<header class="sticky top-0 z-99999 flex w-full border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900">
  <div class="flex w-full items-center justify-between px-4 py-3 sm:px-6 lg:px-6 lg:py-4">
    <div class="flex items-center gap-3">
      <button
        type="button"
        aria-label="Свернуть или развернуть боковое меню"
        :class="sidebarToggle ? 'bg-gray-100 dark:bg-gray-800' : ''"
        class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 text-gray-600 transition hover:bg-gray-100 dark:border-gray-800 dark:text-gray-300 dark:hover:bg-gray-800"
        @click.stop="sidebarToggle = !sidebarToggle"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6h16M4 12h12M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
      <a href="index.html" class="flex items-center gap-2 lg:hidden">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand-500 text-xs font-bold text-white">TV</span>
        <span class="text-base font-semibold text-gray-900 dark:text-white">ТВ МЕНЮ</span>
      </a>
      <div class="hidden lg:block">
        <p class="text-sm font-semibold text-gray-900 dark:text-white">ТВ МЕНЮ</p>
        <p class="text-xs text-gray-500 dark:text-gray-400">Управление экранным меню</p>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <span data-session-user class="hidden text-sm text-gray-500 dark:text-gray-400 sm:block"></span>
      <button
        type="button"
        aria-label="Переключить тему"
        class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 text-gray-600 transition hover:bg-gray-100 dark:border-gray-800 dark:text-gray-300 dark:hover:bg-gray-800"
        @click="darkMode = !darkMode"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M20.1 15.5A8.4 8.4 0 0 1 8.5 3.9a8.4 8.4 0 1 0 11.6 11.6Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <button id="logout-button" type="button" class="hidden rounded-lg border border-gray-200 px-3 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-100 sm:block dark:border-gray-800 dark:text-gray-300 dark:hover:bg-gray-800">Выйти</button>
    </div>
  </div>
</header>
