<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Вход — ТВ МЕНЮ</title>
  </head>
  <body x-data="{ loaded: true, darkMode: false }" x-init="darkMode = JSON.parse(localStorage.getItem('darkMode') || 'false'); $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))" :class="{ 'dark bg-gray-900': darkMode }">
    <include src="./partials/preloader.html"></include>

    <main class="flex min-h-screen items-center justify-center bg-gray-50 px-4 py-10 dark:bg-gray-900 sm:px-6">
      <section class="w-full max-w-md rounded-2xl border border-gray-200 bg-white p-6 shadow-theme-sm dark:border-gray-800 dark:bg-white/[0.03] sm:p-8" aria-labelledby="signin-title">
        <div class="flex items-center gap-3">
          <span class="flex h-11 w-11 items-center justify-center rounded-xl bg-brand-500 text-sm font-bold text-white">TV</span>
          <div>
            <p class="text-lg font-semibold text-gray-900 dark:text-white">ТВ МЕНЮ</p>
            <p class="text-sm text-gray-500 dark:text-gray-400">Панель управления</p>
          </div>
        </div>

        <div class="mt-8">
          <h1 id="signin-title" class="text-2xl font-semibold text-gray-900 dark:text-white">Вход в систему</h1>
        </div>

        <form id="signin-form" class="mt-6 space-y-5" novalidate>
          <div>
            <label for="username" class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">Логин</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-800 outline-hidden transition focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:text-white/90" />
          </div>
          <div>
            <label for="password" class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">Пароль</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 text-sm text-gray-800 outline-hidden transition focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:text-white/90" />
          </div>

          <p id="signin-message" class="hidden rounded-lg border px-3 py-2 text-sm" role="alert" aria-live="polite"></p>
          <button id="signin-submit" type="submit" class="flex h-11 w-full items-center justify-center rounded-lg bg-brand-500 px-4 text-sm font-medium text-white transition hover:bg-brand-600 disabled:cursor-wait disabled:opacity-70">Войти</button>
        </form>
      </section>
    </main>
  </body>
</html>
