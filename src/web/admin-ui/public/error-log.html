<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ТВ МЕНЮ</title>
    <script src="/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="/css/index.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="error-log">
    <div class="app-shell">
      <div class="app-content">
        <main class="main-content error-log-content">
          <div class="page-heading compact-heading">
            <div><p class="eyebrow">ДИАГНОСТИКА</p><h1>Журнал ошибок</h1></div>
            <p>Автоматически собирает необработанные ошибки JavaScript, rejected Promise и сетевые/5xx сбои интерфейса.</p>
          </div>

          <p class="form-message is-hidden" id="error-log-message" role="status" aria-live="polite"></p>

          <section class="settings-card error-log-toolbar-card" aria-label="Управление журналом ошибок">
            <div class="error-log-toolbar">
              <label class="field error-log-filter"><span>Фильтр</span><input id="error-log-filter" type="search" placeholder="Ошибка, страница, источник…" /></label>
              <div class="form-actions">
                <button class="button button-secondary" id="error-log-refresh" type="button">Обновить</button>
                <button class="button button-danger" id="error-log-clear" type="button">Очистить журнал</button>
              </div>
            </div>
            <div class="error-log-summary" aria-live="polite">
              <span>Записей: <strong id="error-log-count">0</strong></span>
              <span id="error-log-policy">Политика хранения загружается…</span>
            </div>
          </section>

          <section class="error-log-list" id="error-log-list" aria-label="Ошибки веб-интерфейса"></section>
          <p class="empty-state is-hidden" id="error-log-empty">Ошибок веб-интерфейса пока нет.</p>
        </main>
      </div>
    </div>
  </body>
</html>
