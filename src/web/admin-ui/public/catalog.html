<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ТВ МЕНЮ</title>
    <script src="/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="/css/index.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="catalog">
    <div class="app-shell">
      <div class="app-content">
        <main class="main-content workspace-content">
          <div class="page-heading"><p class="eyebrow">КАТАЛОГ</p><h1>Продукция и тара</h1><p>Позиции каталога используются редакторами всех мониторов.</p></div>
          <div class="workspace-grid catalog-grid">
            <section class="settings-card" id="products">
              <div class="card-heading"><div><p class="eyebrow">ПРОДУКЦИЯ</p><h2 id="product-form-title">Новая продукция</h2></div><button class="text-button is-hidden" id="cancel-product-edit" type="button">Отменить</button></div>
              <form id="product-form" class="form-grid">
                <label class="field field-full"><span>Название</span><input id="product-name" maxlength="120" required /></label>
                <label class="field"><span>Производитель</span><input id="product-producer" maxlength="120" /></label>
                <label class="field"><span>Крепость</span><input id="product-strength" maxlength="20" placeholder="Например, 4,5%" /></label>
                <label class="field field-full"><span>Характеристики</span><input id="product-characteristics" maxlength="180" placeholder="Например, светлое, фильтрованное" /></label>
                <label class="field"><span>Цена за 1 л, ₽</span><input id="product-price-primary" inputmode="decimal" maxlength="16" placeholder="240" required /></label>
                <label class="field"><span>Цена за 1,5 л</span><input disabled value="Рассчитывается автоматически" /></label>
                <label class="field"><span>Цвет напитка</span><select id="product-beverage-color"><option value="none">Не указан</option><option value="light">Светлый</option><option value="dark">Тёмный</option></select></label>
                <label class="field"><span>Фильтрация</span><select id="product-filtration"><option value="none">Не указана</option><option value="filtered">Фильтрованное</option><option value="unfiltered">Нефильтрованное</option></select></label>
                <label class="toggle-row"><span><strong>Алкогольная продукция</strong><small>Используется как свойство записи.</small></span><input id="product-alcoholic" type="checkbox" /><i aria-hidden="true"></i></label>
                <label class="toggle-row"><span><strong>Активна</strong><small>Доступна для добавления в меню.</small></span><input id="product-active" type="checkbox" checked /><i aria-hidden="true"></i></label>
                <p class="form-message is-hidden field-full" id="product-message" role="status"></p>
                <div class="form-actions field-full"><button class="button button-primary" id="product-submit" type="submit">Добавить продукцию</button></div>
              </form>
            </section>
            <section class="settings-card">
              <div class="card-heading"><div><p class="eyebrow">ПРОДУКЦИЯ</p><h2>Список</h2></div><button class="button button-secondary" id="refresh-catalog" type="button">Обновить</button></div>
              <div class="record-list" data-products-list></div><p class="empty-state is-hidden" data-products-empty>Продукции пока нет.</p>
            </section>
            <section class="settings-card" id="packaging">
              <div class="card-heading"><div><p class="eyebrow">ТАРА</p><h2 id="packaging-form-title">Новая тара</h2></div><button class="text-button is-hidden" id="cancel-packaging-edit" type="button">Отменить</button></div>
              <form id="packaging-form" class="form-grid">
                <label class="field field-full"><span>Название тары</span><input id="packaging-name" maxlength="120" placeholder="Например, бутылка ПЭТ 1,5 л" required /></label>
                <label class="field"><span>Цена, ₽</span><input id="packaging-price" inputmode="decimal" maxlength="16" placeholder="12" required /></label>
                <label class="toggle-row"><span><strong>Активна</strong><small>Доступна для добавления в меню.</small></span><input id="packaging-active" type="checkbox" checked /><i aria-hidden="true"></i></label>
                <p class="form-message is-hidden field-full" id="packaging-message" role="status"></p>
                <div class="form-actions field-full"><button class="button button-primary" id="packaging-submit" type="submit">Добавить тару</button></div>
              </form>
            </section>
            <section class="settings-card">
              <div class="card-heading"><div><p class="eyebrow">ТАРА</p><h2>Список</h2></div></div>
              <div class="record-list" data-packaging-list></div><p class="empty-state is-hidden" data-packaging-empty>Тара пока не добавлена.</p>
            </section>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
