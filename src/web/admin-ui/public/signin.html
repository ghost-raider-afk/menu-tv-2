<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ТВ МЕНЮ</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body data-page="signin" class="signin-page">
    <main class="signin-layout">
      <section class="signin-card" aria-labelledby="signin-title">
        <a class="brand signin-brand" href="/signin.html"><span class="brand-mark">ТВ</span><span data-app-name>ТВ МЕНЮ</span></a>
        <div class="signin-heading"><p class="eyebrow">ПАНЕЛЬ УПРАВЛЕНИЯ</p><h1 id="signin-title">Вход в систему</h1></div>
        <form id="signin-form" class="form-stack" novalidate>
          <label class="field"><span>Логин</span><input id="username" name="username" type="text" autocomplete="username" required autofocus /></label>
          <label class="field"><span>Пароль</span><input id="password" name="password" type="password" autocomplete="current-password" required /></label>
          <p class="form-message is-hidden" id="signin-message" role="alert" aria-live="polite"></p>
          <button class="button button-primary button-wide" id="signin-submit" type="submit">Войти</button>
        </form>
      </section>
    </main>
  </body>
</html>
